<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI地域商社 — 関西の食材を、人と人でつなぐ地域マーケット</title>
<meta name="description" content="飲食店の「欲しい」と、農家の「売りたい」を、1つの仕入れ案にまとめる関西の地域マーケット。">
<meta name="theme-color" content="#fbf7ee">
<!-- design tokens: ivory #fbf7ee / cream #fffdf8 / sage #557a5c / pale orange #fdeadb -->

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="地域商社">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* A little Kansai marché: ivory paper, soft leaf green for actions, pale orange and a touch of yellow for warmth */
:root{
  --bg:#f7f9f5; --card:#ffffff; --beige:#eef1ea; --ink:#2f332e; --ink-2:#6b7268; --ink-3:#95998f; --line:#e4e8de;
  --green:#3f7a52; --green-ink:#ffffff; --green-soft:#e4f0e6; --green-pale:#f1f7f2;
  --orange:#b8642c; --orange-soft:#fdeadb; --yellow:#f3d77b; --yellow-soft:#fdf4d3;
  --f:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --shadow:0 1px 2px rgba(40,50,40,.04);
  --shadow-lift:0 2px 6px rgba(40,50,40,.06);
  --nav:70px; --side:236px; --tint-mix:100%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1a1814; --card:#24211c; --beige:#2d2922; --ink:#f2ede2; --ink-2:#c3bba9; --ink-3:#958e7e; --line:#3a352c;
  --green:#8cc79a; --green-ink:#14231a; --green-soft:#24362a; --green-pale:#1f2a22;
  --orange:#f0a36f; --orange-soft:#3b2a1d; --yellow:#e9c862; --yellow-soft:#3a3320;
  --shadow:0 2px 8px rgba(0,0,0,.3); --shadow-lift:0 6px 18px rgba(0,0,0,.4); --tint-mix:22%;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1a1814; --card:#24211c; --beige:#2d2922; --ink:#f2ede2; --ink-2:#c3bba9; --ink-3:#958e7e; --line:#3a352c;
  --green:#8cc79a; --green-ink:#14231a; --green-soft:#24362a; --green-pale:#1f2a22;
  --orange:#f0a36f; --orange-soft:#3b2a1d; --yellow:#e9c862; --yellow-soft:#3a3320;
  --shadow:0 2px 8px rgba(0,0,0,.3); --shadow-lift:0 6px 18px rgba(0,0,0,.4); --tint-mix:22%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;font-size:15.5px;line-height:1.8;padding-inline:16px;padding-bottom:calc(var(--nav) + 44px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
.wrap{max-width:740px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.45;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:3px}

/* type scale */
.page-title{font-size:25px;letter-spacing:.02em}
.lead{font-size:14.5px;color:var(--ink-2);margin-top:6px}
.sec-title{font-size:19px}
.cap{font-size:12.5px;color:var(--ink-3);line-height:1.65}
.muted{color:var(--ink-2)}
.page-h{padding-top:6px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* top bar (mobile) */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px);margin-inline:-16px;padding-inline:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;max-width:740px;margin:0 auto}
.logo{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.logo img{width:30px;height:30px;border-radius:10px}
.back{border:0;background:var(--card);color:var(--green);font-weight:700;font-size:14.5px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);border-radius:22px 22px 0 0}
nav.tabs .in{max-width:740px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav);padding-inline:6px}
nav.tabs .side-logo{display:none}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--ink-3);cursor:pointer;padding:0;transition:color .2s}
nav.tabs .emo{font-size:21px;line-height:1;width:54px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:999px;filter:grayscale(.55) opacity(.75);transition:all .25s}
nav.tabs button[aria-current="page"]{color:var(--green)}
nav.tabs button[aria-current="page"] .emo{background:var(--green-soft);filter:none;transform:translateY(-2px)}

main{display:flex;flex-direction:column;gap:34px;padding-top:6px}
main.enter{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.soft{background:var(--green-pale);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14.5px}
.mini-list{display:flex;flex-direction:column;gap:10px}
.mini .t{font-weight:700}
.mini .s{font-size:12.5px;color:var(--ink-3)}
.mini.clickable{cursor:pointer;text-align:left;width:100%;transition:transform .2s,box-shadow .2s}
.mini.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

/* buttons: pill shaped, press to shrink */
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:15px;line-height:1.4;transition:transform .12s,box-shadow .2s,filter .2s,border-color .2s}
.btn:hover{border-color:var(--ink-3)}
.btn:active,.act:active,.chip:active,.mcard:active{transform:scale(.97)}
.btn-main{background:var(--green);border-color:var(--green);color:var(--green-ink);padding:16px 22px;font-size:16px;width:100%;box-shadow:0 6px 16px color-mix(in srgb,var(--green) 28%,transparent)}
.btn-main:hover{filter:brightness(1.06);border-color:var(--green)}
.btn-sub{background:var(--green-soft);border-color:transparent;color:var(--green)}
.btn-sub:hover{border-color:var(--green)}
.btn.small{padding:7px 14px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:wait}
.btn.danger{color:var(--orange);border-color:var(--orange-soft);background:var(--orange-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.link{background:none;border:0;color:var(--green);font-weight:700;cursor:pointer;padding:4px 0;font-size:14.5px;text-align:left}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* badges */
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--beige);color:var(--ink-2)}
.tag.good{background:var(--green-soft);color:var(--green)}
.tag.hot{background:var(--orange-soft);color:var(--orange)}
.tag.sun{background:var(--yellow-soft);color:#8a6a12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.sun{color:var(--yellow)}}

/* messages */
.msg{border-radius:18px;padding:13px 16px;font-size:14.5px;background:var(--beige)}
.msg.warn,.msg.err{background:var(--orange-soft)}
.msg.warn b,.msg.err b{color:var(--orange)}
.msg.ok{background:var(--green-soft)}

/* home hello */
.hello{position:relative;border-radius:28px;padding:24px 22px 22px;background:linear-gradient(160deg,var(--green-pale) 0%,var(--yellow-soft) 100%);overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:200px}
.hello .txt{position:relative;z-index:1;max-width:calc(100% - 118px)}
.hello h1{font-size:24px;letter-spacing:.02em}
.nw{display:inline-block}
.hello .art{position:absolute;right:-6px;bottom:-4px;width:150px;height:auto;opacity:.95}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;list-style:none;margin:6px 0 0;padding:0;position:relative;z-index:1}
.flow li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink-2);line-height:1.35;position:relative}
.flow li .dot{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--shadow)}
.flow li:not(:last-child)::after{content:"";position:absolute;top:20px;left:calc(50% + 24px);right:calc(-50% + 24px);border-top:2px dotted color-mix(in srgb,var(--green) 40%,transparent)}
@media (max-width:420px){.hello .txt{max-width:100%}.hello .art{width:112px;top:10px;bottom:auto;right:-10px;opacity:.55}}

.actions{display:grid;grid-template-columns:1fr;gap:10px}
.act{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:700;font-size:15.5px;transition:transform .15s,box-shadow .2s,border-color .2s}
.act:hover{border-color:var(--green);box-shadow:var(--shadow)}
.act .l{display:flex;align-items:center;gap:12px}
.act .emo{width:38px;height:38px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:18px}
.act .arrow{color:var(--ink-3);font-size:18px}
.act.primary{background:var(--green);border-color:var(--green);color:var(--green-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--green) 26%,transparent)}
.act.primary .emo{background:rgba(255,255,255,.2)}
.act.primary .arrow{color:var(--green-ink)}
.act.primary .act-txt small{color:rgba(255,255,255,.82)}
/* 2行表示のボタン（仕入れ案を作る／販売できるものを登録）の高さ・余白・文字サイズをそろえる共通クラス */
.act.two-line{border-radius:24px;padding:16px 20px;border-width:2px}
.act.two-line .act-txt{font-size:17px;line-height:1.5;text-align:left}
.act.two-line .act-txt small{display:block;font-size:14.5px;font-weight:700}
.act.stacked{border-color:var(--green-soft);background:var(--green-soft)}
.act.stacked:hover{border-color:var(--green)}
.act.stacked .emo{background:var(--card)}
.act.stacked .act-txt small{color:var(--ink-2)}
@media (min-width:700px){.actions{grid-template-columns:repeat(2,1fr)}.act{padding:14px 16px}}

/* pick-of-the-day card */
.pick{position:relative;background:var(--card);border-radius:28px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;overflow:hidden}
.pick-head{display:flex;gap:16px;align-items:center}
.pick .art-bubble{width:92px;height:92px;flex:none;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:52px;background:color-mix(in srgb,var(--t) var(--tint-mix),var(--card))}
.pick h3{font-size:24px}
.pick h3 small{font-size:13.5px;font-weight:500;color:var(--ink-2);margin-left:6px}
.where{font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 12px}
.quote-b{position:relative;background:var(--yellow-soft);border-radius:18px;padding:12px 16px;font-size:15px}
.quote-b::before{content:"";position:absolute;top:-7px;left:34px;width:14px;height:14px;background:var(--yellow-soft);transform:rotate(45deg);border-radius:3px}
.pick-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.price{white-space:nowrap}
.price b{font-size:24px}
.price span{font-size:13px;color:var(--ink-3)}

/* marché cards */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.mcard .img{position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:54px;background:color-mix(in srgb,var(--t) var(--tint-mix),var(--card))}
.mcard .img .tags{position:absolute;left:8px;top:8px;right:8px}
.mcard .img .tag{background:color-mix(in srgb,var(--card) 92%,transparent)}
.mcard .img .tag.good{color:var(--green)}
.mcard .img .tag.hot{color:var(--orange)}
.mcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard h3{font-size:17px;line-height:1.35}
.mcard h3 small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:4px}
.mcard .where{font-size:12.5px;flex-direction:column;gap:0}
.mcard .pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:auto;flex-wrap:wrap}
.mcard .pr b{font-size:18px}
.mcard .pr .left{font-size:12.5px;color:var(--ink-2);font-weight:700}
.mcard .pr .left.hot{color:var(--orange)}
.mcard .go{margin-top:6px;width:100%;padding:8px 10px;font-size:13px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:12px;overflow-x:auto;padding:4px 16px 10px;margin-inline:-16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}

/* search */
.search{display:flex;flex-direction:column;gap:12px}
.search-box{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:14px 18px;box-shadow:var(--shadow);transition:border-color .2s}
.search-box:focus-within{border-color:var(--green)}
.search-box .emo{font-size:20px;line-height:1.6}
.search-box textarea{flex:1;border:0;background:transparent;resize:none;font-size:16.5px;line-height:1.6;min-height:54px;outline:none;padding:0}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;margin-inline:-16px}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink-2);font-weight:700;transition:transform .12s,background .2s,border-color .2s}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.chip.ex{background:var(--beige);border-color:transparent;font-size:13px;font-weight:500}
.chip.ex:hover{border-color:var(--ink-3)}
.ask-cta{display:flex;align-items:center;gap:14px;border:0;background:var(--yellow-soft);border-radius:24px;padding:14px 18px;cursor:pointer;text-align:left;width:100%;transition:transform .15s}
.ask-cta:hover{transform:translateY(-2px)}
.ask-cta img{width:44px;height:44px;border-radius:14px;flex:none}
.ask-cta b{display:block;font-size:15.5px}
.ask-cta span{font-size:13px;color:var(--ink-2)}

/* AI chat */
.chat{display:flex;flex-direction:column;gap:14px}
.brow{display:flex;gap:10px;align-items:flex-end}
.brow.me{justify-content:flex-end}
.avatar{width:42px;height:42px;border-radius:14px;flex:none;box-shadow:var(--shadow)}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 22px 6px;padding:14px 16px;max-width:86%;box-shadow:var(--shadow);animation:pop .35s ease both}
.bubble.me{background:var(--green);border-color:var(--green);color:var(--green-ink);border-radius:22px 22px 6px 22px;box-shadow:none}
.bubble .name{font-size:12px;font-weight:700;color:var(--green);margin-bottom:2px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:8px 8px 8px 18px;box-shadow:var(--shadow)}
.composer:focus-within{border-color:var(--green)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.6;padding:8px 0;min-height:44px}
.composer .btn{flex:none;padding:10px 18px}
.why{background:var(--yellow-soft);border-radius:16px;padding:10px 14px}
.why .t{font-size:12.5px;font-weight:700;color:#8a6a12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .why .t{color:var(--yellow)}}
.why ul{margin:2px 0 0;padding-left:1.1em;font-size:14px}

/* detail sheet */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(60,50,30,.32);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.sheet .img{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:84px;background:color-mix(in srgb,var(--t) var(--tint-mix),var(--card));position:relative}
.sheet .x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.sheet .in{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:24px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:28px;max-height:84vh}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:0;font-weight:700;font-size:15px;overflow-wrap:anywhere}

/* forms */
.steps{display:flex;justify-content:space-between;list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:16px;right:16px;top:15px;border-top:2px dotted var(--line)}
.steps li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);position:relative;font-weight:700;flex:1}
.steps li .n{width:32px;height:32px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}
.steps li.on{color:var(--ink)}
.steps li.on .n{background:var(--green);border-color:var(--green);color:var(--green-ink);transform:scale(1.08)}
.steps li.done .n{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink-2);background:var(--beige);border-radius:999px;padding:8px 16px}
.progress b{color:var(--orange)}
.progress.done{background:var(--green-soft)}
.progress.done b{color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.sec-label{font-size:13.5px;color:var(--ink-2);font-weight:700}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);min-width:0;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--green);outline:none}
.field.miss input,.field.miss select{border-color:var(--orange);background:var(--orange-soft)}
.pair{display:flex;gap:8px}
.pair>*{flex:1;min-width:0}
.big-input{font-size:24px!important;font-weight:700;padding:14px 16px!important}
.quote{font-size:14px;background:var(--beige);border-radius:16px;padding:10px 14px;color:var(--ink-2)}
.err-list{margin:0;padding-left:18px;font-size:13.5px;color:var(--orange)}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--green)}
@media (max-width:440px){.grid{grid-template-columns:1fr}}
.celebrate{text-align:center;align-items:center;background:linear-gradient(160deg,var(--green-pale),var(--yellow-soft));border:0}
.celebrate .big{font-size:46px;line-height:1}
.celebrate h2{font-size:22px}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:3px;z-index:40;pointer-events:none;animation:fall 1.6s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.2}}

/* plan slip */
.slip{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.slip-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px}
.slip-head.ok{background:linear-gradient(160deg,var(--green-soft),var(--green-pale))}
.slip-head.bad{background:var(--orange-soft)}
.slip-no{font-size:12.5px;color:var(--ink-3)}
.verdict{font-weight:700;font-size:19px;margin-top:4px;line-height:1.5;text-wrap:balance}
.slip-head.ok .verdict{color:var(--green)}
.slip-head.bad .verdict{color:var(--orange)}
.stamp{flex:none;width:72px;height:72px;border:2px dashed var(--orange);border-radius:50%;color:var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);line-height:1.2;text-align:center;background:var(--card)}
.stamp b{font-size:15px;letter-spacing:.06em}
.stamp small{font-size:9.5px;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);margin:0;border-bottom:1px dashed var(--line)}
.sum>div{padding:16px 20px;border-right:1px dashed var(--line);min-width:0}
.sum>div:last-child{border-right:0}
.sum dt{font-size:12.5px;color:var(--ink-3);font-weight:700}
.sum dd{margin:2px 0 0;font-size:15px;line-height:1.5}
.sum .bigv{font-weight:700;font-size:24px;line-height:1.25}
.sum .bigv small{font-size:13px;margin-left:2px}
.sum .sub{display:block;font-size:12.5px;color:var(--ink-3)}
@media (max-width:520px){.sum{grid-template-columns:1fr}.sum>div{border-right:0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:4.6em 1fr;gap:10px;align-items:baseline}.sum>div:last-child{border-bottom:0}}
.slip-sec{padding:16px 22px 4px;font-size:13px;font-weight:700;color:var(--ink-3)}
.fc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:12px 22px;align-items:center}
.fc .face{grid-row:1/span 2;width:42px;height:42px;border-radius:14px;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:20px}
.fc .who{font-weight:700;font-size:15.5px}
.fc .who span{font-weight:500;font-size:12.5px;color:var(--ink-3);margin-left:4px}
.fc .meta{font-size:12.5px;color:var(--ink-2);grid-column:2;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.fc .amt{grid-row:1/span 2;grid-column:3;text-align:right}
.fc .amt b{font-size:21px}
.fc .amt small{font-size:12.5px;margin-left:2px}
.fc .amt .yen{font-size:12.5px;color:var(--ink-2)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 22px;background:var(--beige);font-size:16px;font-weight:700;margin-top:8px}
.foot{padding:14px 22px;font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px;line-height:1.65}
.slip.void{opacity:.7;box-shadow:none;border-radius:18px}
.slip.void .void-body{text-decoration:line-through;text-decoration-color:var(--orange)}
.cond{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-2)}
.cond b{color:var(--ink);font-weight:500}
details summary{cursor:pointer;font-size:15px;font-weight:700}
.ex{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.ex li{display:flex;flex-direction:column}
.ex li span{color:var(--ink-3);font-size:13px}
.sugg{display:flex;flex-direction:column;gap:10px}
.sugg .s{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--beige);border-radius:18px;padding:12px 16px;flex-wrap:wrap}
.sugg .s div{font-size:15px;font-weight:700;flex:1 1 200px}
.sugg .s div span{display:block;font-size:13px;color:var(--ink-2);font-weight:500}

/* producer listing cards */
.group-h{font-size:15px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.lst{display:flex;flex-direction:column;gap:12px}
.lc.off{opacity:.6}
.lc.flash{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.lc-top{display:flex;gap:14px;align-items:center}
.lc-top .face{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;background:color-mix(in srgb,var(--t) var(--tint-mix),var(--card));flex:none}
.lc-top .grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 12px;font-size:14.5px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.qty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}
.qty input{width:86px;text-align:right;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--bg);font-size:17px}
.qty .step{width:42px;height:42px;border:1.5px solid var(--line);border-radius:50%;background:var(--card);font-size:20px;cursor:pointer;line-height:1;transition:transform .12s}
.qty .step:active{transform:scale(.9)}
.lines{list-style:none;margin:0;padding:0;font-size:14.5px;display:flex;flex-direction:column;gap:2px}
.lines li{display:flex;justify-content:space-between;gap:12px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:999px;font-size:14px;max-width:min(560px,calc(100% - 32px));width:max-content;display:flex;gap:12px;align-items:center;z-index:20;animation:pop .3s ease both}
.toast button{background:none;border:0;color:var(--card);text-decoration:underline;font-weight:700;cursor:pointer;white-space:nowrap}
.toast.ok{background:var(--green);color:var(--green-ink)}
.toast.ok button{color:var(--green-ink)}
.toast.err{background:var(--orange);color:#fff}
.toast.err button{color:#fff}
/* loading skeleton */
.skel{display:flex;flex-direction:column;gap:16px}
.skel i{display:block;border-radius:24px;background:linear-gradient(90deg,var(--beige) 25%,var(--card) 50%,var(--beige) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
/* touch targets */
.btn,.chip,.act,.link{min-height:44px}
.btn.small{min-height:38px}
.link{display:inline-flex;align-items:center}
/* compare tray */
.cmp-tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--green);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow-lift);font-weight:700;font-size:14px;max-width:calc(100% - 32px);animation:pop .3s ease both}
@media (min-width:960px){.cmp-tray{bottom:28px;left:calc(50% + var(--side)/2)}}
.mcard .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mcard .acts .btn-sub{flex:1 1 100%!important;white-space:nowrap}
.mcard .acts .btn{flex:1;padding:8px 6px;font-size:13px;min-height:40px}
.cmp-btn{flex:0 0 auto!important;width:40px;padding:0!important;font-size:16px!important}
.cmp-btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.mcard .hand{font-size:12px;color:var(--ink-2)}
.ctable{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.ctable th,.ctable td{padding:10px 8px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top}
.ctable th{color:var(--ink-3);font-size:12.5px;font-weight:700;white-space:nowrap;position:sticky;left:0;background:var(--bg)}
.ctable td.best{color:var(--green);font-weight:700}
.ctable td .btn{white-space:nowrap;padding:6px 10px;font-size:12.5px;min-height:36px}
.cwrap{overflow-x:auto;margin-inline:-22px;padding-inline:22px}
/* filters */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters select{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--card);font-size:14px;font-weight:700;color:var(--ink-2);min-height:44px}
.filters select.on{border-color:var(--green);color:var(--green);background:var(--green-soft)}
@media (min-width:700px){.filters{grid-template-columns:repeat(3,1fr)}}
/* farm profile + matches */
.scene{aspect-ratio:16/8;background:linear-gradient(180deg,#fdf4d3,#f1f7ee);position:relative;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.fcard .scene{aspect-ratio:16/9}
.fcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.fcard b{font-size:16px}
.fcard .s{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.need{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.need .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.need ul{margin:0;padding-left:1.2em;font-size:14px}
.need ul li::marker{content:"✓ ";color:var(--green)}
.match-btn{background:var(--yellow-soft);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:#7a5c0e;min-height:40px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .match-btn{color:var(--yellow)}}
.field textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);font-size:16px;resize:vertical;min-height:84px;line-height:1.6}
.field textarea:focus{border-color:var(--green);outline:none}
.hint-err{font-size:13px;color:var(--orange)}
/* role switch */
.roles{display:inline-grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:999px;padding:4px;gap:2px;position:relative;z-index:1;margin-bottom:10px;align-self:flex-start}
.roles button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer;min-height:38px;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);box-shadow:var(--shadow)}
/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--beige);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:9px 10px;font-weight:700;cursor:pointer;color:var(--ink-2);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--green);box-shadow:var(--shadow)}
/* ai status */
.ai-off{display:flex;gap:10px;align-items:flex-start;background:var(--beige);border:1.5px dashed var(--ink-3);border-radius:18px;padding:12px 14px;font-size:13.5px;line-height:1.7}
.ai-off b{color:var(--ink)}
.ai-on{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:3px 10px}
.ai-on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
/* inquiries */
.inq{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.inq.new{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.inq .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.inq .msgtxt{background:var(--beige);border-radius:14px;padding:8px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto}
.explain{background:var(--green-pale);border-radius:14px;padding:10px 12px;font-size:14px}
.facts-box{border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--bg)}
.facts-box .t,.ideas .t,.understood .t{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.facts-box .facts div{background:var(--card)}
.ideas{border-radius:16px;padding:10px 14px;background:var(--card);border:1px dashed var(--line)}
.understood{background:var(--green-pale);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fav-btn{flex:0 0 auto!important;width:44px;padding:0!important;font-size:18px!important;color:var(--orange)}
.fav-btn[aria-pressed="true"]{background:var(--orange-soft);border-color:var(--orange-soft)}
.inq-steps{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink-3);flex-wrap:wrap}
.inq-steps .on{background:var(--orange-soft);color:var(--orange);border-radius:999px;padding:2px 10px}
.inq-steps .done{color:var(--green)}
.inq-steps .sep{color:var(--line)}
.actions.four{grid-template-columns:1fr}
@media (min-width:700px){.actions.four{grid-template-columns:repeat(2,1fr)}}
.preview-wrap{max-width:240px;pointer-events:none}
.why-line{font-size:12.5px;color:#7a5c0e;background:var(--yellow-soft);border-radius:10px;padding:5px 8px;line-height:1.5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .why-line{color:var(--yellow)}}
.quick-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.quick-row:last-child{border-bottom:0}
.quick-row .ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quick-row input{border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;background:var(--bg);font-size:15px}
.quick-row input[type=number]{width:80px;text-align:right}
/* 判定の行（一致・一部・不一致・未確認） */
.st-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.st-rows li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.st-rows li::marker,.need .st-rows li::marker,.need .next-list li::marker{content:none}
.need .st-rows{padding:0;margin:0}
.st-rows .req{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--beige);color:var(--ink-2);vertical-align:1px}
.st-rows .req.must{background:var(--orange-soft);color:var(--orange)}
.st-rows li .tag{flex:none;min-width:64px;justify-content:center}
.st-rows li b{color:var(--ink)}
.st-rows li.st-ng b{color:var(--orange)}
.sa-form .grid,.opp-sim .grid{grid-template-columns:1fr 1fr;gap:12px}
#sa-sim .mini .btn,.next-list .btn{white-space:nowrap;flex:none}
.sa-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0}
.sa-sum div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.sa-sum b{font-size:24px;font-variant-numeric:tabular-nums;color:var(--green)}
.sa-sum span{font-size:11.5px;color:var(--ink-2);font-weight:700;line-height:1.35}
.sa-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);margin-bottom:12px}
.sa-card.dim,.need.dim{border-style:dashed;background:var(--bg)}
.sa-head{display:flex;gap:12px;align-items:center}
.sa-head .face{width:48px;height:48px;border-radius:14px;background:var(--t);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex:none}
.sa-head .face img{width:100%;height:100%;object-fit:cover}
.sa-head b small{font-weight:500;font-size:13px;color:var(--ink-2)}
.sa-head .price{text-align:right;flex:none}
.sa-head .price b{font-size:19px;font-variant-numeric:tabular-nums}
.sa-head .price span{display:block;font-size:11.5px;color:var(--ink-2)}
.sa-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--beige);border-radius:16px;padding:8px}
.sa-nums div{display:flex;flex-direction:column;gap:2px;text-align:center}
.sa-nums span{font-size:11px;color:var(--ink-2);font-weight:700}
.sa-nums b{font-size:15px;font-variant-numeric:tabular-nums}
.next-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.next-list li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--green-pale);border-radius:16px;padding:10px 14px;font-size:14px}
.next-list li::marker{content:none}
.next-list li span{flex:1 1 200px}
.fixes{margin:0;padding-left:1.2em;font-size:13.5px}
.need .fixes li::marker{content:"→ ";color:var(--ink-3)}
.opp-sim summary{font-weight:700;cursor:pointer}
.sd-table td{font-size:12.5px;vertical-align:top;min-width:96px}
.sd-table .sd{white-space:nowrap}
.sd-table .sd.s{color:var(--green);font-weight:700}
.sd-table .sd.d{color:var(--orange);font-weight:700}
.sd-table .sd.p{color:var(--ink-2)}
.stage-help summary{cursor:pointer;font-weight:700}
.qty-note{display:block;margin-top:2px}
.mini .btn.small{white-space:nowrap;flex:none}
.tag.rank{background:var(--green);color:var(--green-ink)}
.pairline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.pairline .arrow{color:var(--green);font-weight:700;font-size:18px}
.coord-cta{display:flex;align-items:center;gap:14px;border:1.5px solid var(--green);background:linear-gradient(160deg,var(--green-pale),var(--card));border-radius:24px;padding:16px 18px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.coord-cta b{display:block;font-size:16.5px}
.coord-cta span.s{font-size:13px;color:var(--ink-2)}
.coord-cta .em{font-size:32px;width:46px;text-align:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.kpis b{font-size:24px;line-height:1.2}
.kpis span{font-size:12px;color:var(--ink-2)}
.chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:8.5em 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.bar-k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-height:auto!important}
.bar-v{display:flex;flex-direction:column;gap:2px}
.hbar{height:9px;border-radius:999px;min-width:2px}
.hbar.a{background:var(--green)}
.hbar.b{background:var(--orange)}
.bar-n{font-weight:700;font-size:13px;white-space:nowrap}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:3px}
.lg.a{background:var(--green)}.lg.b{background:var(--orange)}
.adjust{background:var(--card);border:1px dashed var(--orange);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.adjust .t{font-size:12.5px;font-weight:700;color:var(--orange)}

<script>
(() => {
const KEY = 'ai-chiiki-shosha-v1';
const ITEMS = ['ミニトマト','トマト','なす','きゅうり','ピーマン','万願寺とうがらし','玉ねぎ','じゃがいも','小松菜','ほうれん草','キャベツ','大根'];
const UNITS = ['kg','個','束'];
const REGION_GROUPS = {
  '大阪近郊':['大阪市','北摂','能勢・豊能','北河内','中河内','南河内','泉州'],
  '北摂':['北摂','能勢・豊能'],
  '能勢・豊能':['能勢・豊能'],
  '大阪市':['大阪市'],
  '京都府':['京都府'],
  '兵庫県':['兵庫県']
};
const FARM_REGIONS = ['能勢・豊能','北摂','大阪市','北河内','中河内','南河内','泉州','京都府','兵庫県','奈良県'];
const PLACES = ['拠点P（豊中・共通受渡拠点）','拠点Q（能勢・道の駅）','亀岡集荷所'];
const OFF_REASONS = ['形の不揃い','サイズ不揃い','色むら','軽い表面傷'];
const TABS = ['home','shop','farm','records','settings'];
const MAX_SAVED = 30;
// AIの接続状態。未設定なのに使えるように見せない
function aiStatus(){
  return server.aiReady ? '<span class="ai-on">AI接続中</span>'
    : `<div class="ai-off"><span aria-hidden="true">🔌</span><span><b>AIはまだ設定されていません。</b>管理者がAPIキー（GEMINI_API_KEY）を設定すると、AIが仕入れの希望文を読み取ります。いまは簡易読み取りで項目を埋め、項目を選んで続けられます。</span></div>`;
}
const ART = {'ミニトマト':'🍅','トマト':'🍅','なす':'🍆','きゅうり':'🥒','ピーマン':'🫑','万願寺とうがらし':'🌶️','玉ねぎ':'🧅','じゃがいも':'🥔','小松菜':'🥬','ほうれん草':'🥬','キャベツ':'🥬'};
const TINT = {'ミニトマト':'#fde1d8','トマト':'#fde1d8','なす':'#ece2f4','きゅうり':'#e2f0da','ピーマン':'#e2f0da','万願寺とうがらし':'#e6f1d6','玉ねぎ':'#faebd3','じゃがいも':'#f5e8d2','小松菜':'#e2f0da','ほうれん草':'#e2f0da','キャベツ':'#e8f3e0','大根':'#eef4ea'};
const DAIKON = '<svg viewBox="0 0 64 64" width="1em" height="1em" aria-hidden="true"><path d="M32 4c-4 6-12 6-14 2 2 8 8 12 14 12 6 0 12-4 14-12-2 4-10 4-14-2z" fill="#6aa86e"/><path d="M22 18h20c2 12-2 30-10 42-8-12-12-30-10-42z" fill="#fbfaf4" stroke="#d9d2c0" stroke-width="2"/></svg>';
const art = item => ART[item] || (item === '大根' ? DAIKON : '🥕');
const tint = item => TINT[item] || '#f4ecdc';

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = n => { const d = today0(); d.setDate(d.getDate()+n); return iso(d); };
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const shiftISO = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const daysUntil = s => Math.round((parseISO(s)-today0())/864e5);
const WD = '日月火水木金土';
const rel = s => ({0:'今日',1:'明日',2:'明後日'})[daysUntil(s)] || '';
const fmtDate = s => { if(!s) return ''; const d = parseISO(s); const r = rel(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})${r?' '+r:''}`; };
const fmtStamp = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtAgo = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'たった今' : m < 60 ? `${m}分前` : m < 1440 ? `${Math.round(m/60)}時間前` : `${Math.round(m/1440)}日前`; };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => n.toLocaleString('ja-JP') + '円';
const q = (n,u) => `${+(+n).toFixed(1)}${u}`;
const opt = (list, sel, blank) => (blank!=null?`<option value="">${h(blank)}</option>`:'') + list.map(v => `<option${v===sel?' selected':''}>${h(v)}</option>`).join('');
const placeShort = p => String(p).replace(/（.*）/, '');
const pageHead = (title, lead) => `<header class="page-h"><h1 class="page-title">${title}</h1>${lead ? `<p class="lead">${h(lead)}</p>` : ''}</header>`;
const lowStock = l => l.qty <= Math.max(2 * l.minQty, 2);
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- state ---------- */
// 出品・在庫はサーバー（/api/listings）が持ち、全端末で共有する。
// 画面の位置・下書き・作った仕入れ案・保存した案はこの端末のブラウザに保存する。
const DEFAULT_TEXT = '明後日までに大阪近郊のトマトを10kg、多少形が悪くてもOK';
const PASS_KEY = 'ai-chiiki-shosha-pass';
function freshState(){ return {listings:[], planSeq:0, tab:'home', step:'input', draft:{text:DEFAULT_TEXT, req:null, note:''}, plan:null, saved:[], fdraft:null, visited:false}; }
let S, server = {loaded:false, editLocked:false, shared:true, aiReady:false, error:''};
function load(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch(e) { raw = null; }
  const base = freshState();
  // 旧版の保存データは、いま使う項目だけを引き継ぐ
  S = raw && raw.draft ? {...base, ...Object.fromEntries(Object.keys(base).filter(k => k in raw).map(k => [k, raw[k]]))} : base;
  if(!TABS.includes(S.tab)) S.tab = 'home';
  if(!['input','confirm','result'].includes(S.step)) S.step = 'input';
  if(!Array.isArray(S.saved)) S.saved = [];
  if(S.fdraft && !S.fdraft.d) S.fdraft = null;
  if(S.fdraft){
    const fd = FD();
    S.fdraft = {step:S.fdraft.step, editId:S.fdraft.editId, d:Object.fromEntries(Object.keys(fd).map(k => [k, k in S.fdraft.d ? S.fdraft.d[k] : fd[k]]))};
    if(!(S.fdraft.step >= 1 && S.fdraft.step <= 5)) S.fdraft.step = 1;
  }
  S.listings = [];
}
// 共有データ（出品・在庫）はサーバーが正。この端末には保存しない
function save(){ try { const {listings, _sugg, ...rest} = S; localStorage.setItem(KEY, JSON.stringify(rest)); } catch(e) {} }
function applyData(d){ S.listings = d.listings || []; }
const getPass = () => { try { return localStorage.getItem(PASS_KEY) || ''; } catch(e) { return ''; } };
const setPass = v => { try { localStorage.setItem(PASS_KEY, v); } catch(e) {} };

/* ---------- server data ---------- */
async function api(path, body){
  const headers = {'Content-Type':'application/json'};
  const pc = getPass(); if(body && pc) headers['x-edit-passcode'] = pc;
  const res = await fetch(path, {method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined, cache:'no-store'});
  let data = {}; try { data = await res.json(); } catch(e) {}
  return {ok:res.ok, status:res.status, data};
}
// 入力中のフォームがある画面は、裏での在庫更新で描き直さない
const editing = () => (S.tab === 'shop' && S.step !== 'result') || (S.tab === 'farm' && S.fdraft) || S.tab === 'settings' || Boolean(sheetId);
async function fetchListings(opts){
  let r = null;
  try { r = await api('/api/listings'); } catch(e) {}
  if(!r || !r.ok){ server.error = 'データを読み込めませんでした。通信状態を確かめて、もう一度読み込んでください。'; if(!opts?.quiet || !server.loaded) render(); return; }
  applyData(r.data);
  const first = !server.loaded;
  server = {loaded:true, editLocked:Boolean(r.data.editLocked), shared:Boolean(r.data.shared), aiReady:Boolean(r.data.aiReady), error:''};
  if(opts?.quiet && !first && editing()) return;
  render();
}
async function mutate(body){
  let r = null;
  try { r = await api('/api/listings', body); } catch(e) {}
  if(!r){ toast('通信できませんでした。もう一度試してください'); return null; }
  if(r.status === 401){ toast('編集用パスコードを入れてから操作してください'); go('settings'); $('#passcode')?.focus(); return null; }
  if(!r.ok){ toast(`${r.data.error || '保存できませんでした'}（エラーコード ${r.status}）`, null, 'err'); return null; }
  applyData(r.data);
  return r.data;
}
const byId = id => S.listings.find(l => l.id === id);
const isDemoFarm = name => S.listings.some(l => l.demo && l.farm === name);
const openListings = () => S.listings.filter(l => l.active && l.qty > 0 && l.date >= iso(today0()));

/* ---------- allocation (deterministic) ---------- */
const SC = 10; // 0.1単位で計算する
function reasonsFor(l, r){
  const out = [];
  if(!l.active) out.push('公開停止中（出荷不可）');
  if(l.qty <= 0) out.push('在庫なし');
  if(l.unit !== r.unit) out.push(`単位が${l.unit}のため組み合わせられない`);
  const lo = iso(today0());
  if(r.dateMode === 'on' ? l.date !== r.deadline : (l.date > r.deadline || l.date < lo)) out.push(`受渡日${fmtDate(l.date)}が希望日に合わない`);
  if(r.region && !(REGION_GROUPS[r.region]||[]).includes(l.region)) out.push(`地域が対象外（${l.region}）`);
  if(l.grade === '規格外' && !r.allowOff) out.push(`規格外（${l.reason}）は含めない指定`);
  if(r.maxPrice != null && l.price > r.maxPrice) out.push(`単価${yen(l.price)}が上限を超える`);
  if(r.place && l.place !== r.place) out.push(`受渡場所が違う（${l.place}）`);
  if(l.active && l.qty > 0 && l.minQty > l.qty) out.push('在庫が最低販売量に届かない');
  return out;
}
const slotKey = l => `${l.date}|${l.from}-${l.to}|${l.place}`;
const better = (a,b) => a.n !== b.n ? a.n < b.n : a.cost !== b.cost ? a.cost < b.cost : a.key < b.key;
function solve(ls, T, key){
  let dp = new Map([[0,{n:0,cost:0,picks:[],key}]]);
  for(const l of ls){
    const min = Math.round(l.minQty*SC), step = Math.max(1, Math.round(l.step*SC)), cap = Math.round(l.qty*SC);
    const opts = [];
    for(let a = min; a <= cap && a <= T; a += step) opts.push(a);
    const nd = new Map(dp);
    for(const [t,e] of dp) for(const a of opts){
      const nt = t + a; if(nt > T) break;
      const c = Math.round(a/SC*l.price);
      const cand = {n: e.picks.some(p => p.farm === l.farm) ? e.n : e.n+1, cost:e.cost+c, picks:[...e.picks,{id:l.id,farm:l.farm,amt:a/SC,cost:c}], key};
      const cur = nd.get(nt);
      if(!cur || better(cand,cur)) nd.set(nt,cand);
    }
    dp = nd;
  }
  dp.delete(0);
  return dp;
}
function allocate(r){
  const T = Math.round(r.qty*SC);
  const related = S.listings.filter(l => l.item === r.item);
  const elig = [], excluded = [];
  for(const l of related){ const rs = reasonsFor(l,r); rs.length ? excluded.push({id:l.id, reasons:rs}) : elig.push(l); }
  const slots = new Map();
  for(const l of elig){ const k = slotKey(l); if(!slots.has(k)) slots.set(k,[]); slots.get(k).push(l); }
  let best = null, partial = null, maxSlotSum = 0;
  for(const [k,ls] of slots){
    maxSlotSum = Math.max(maxSlotSum, ls.reduce((s,l)=>s+Math.round(l.qty*SC),0));
    const dp = solve(ls,T,k);
    const ex = dp.get(T);
    if(ex && (!best || better(ex,best))) best = {...ex, total:T};
    let mx = 0; for(const t of dp.keys()) if(t > mx) mx = t;
    if(mx){ const e = {...dp.get(mx), total:mx}; if(!partial || mx > partial.total || (mx === partial.total && better(e,partial))) partial = e; }
  }
  const sumAll = elig.reduce((s,l)=>s+Math.round(l.qty*SC),0);
  let status;
  if(best) status = 'ok';
  else if(!elig.length) status = 'none';
  else if(maxSlotSum >= T) status = 'step';
  else if(sumAll >= T && slots.size > 1) status = 'slot';
  else status = 'short';
  const conv = p => p && {slot:p.key, picks:p.picks, total:p.total/SC, cost:p.cost, n:p.n};
  return {status, best:conv(best), partial:conv(partial), excluded, eligCount:elig.length, relatedCount:related.length};
}
function snapshot(item){
  const o = {};
  for(const l of S.listings.filter(l => l.item === item)) o[l.id] = {farm:l.farm, qty:l.qty, unit:l.unit, active:l.active, v:l.v};
  return o;
}
function diffSnap(a, b){
  const out = [];
  for(const id of new Set([...Object.keys(a),...Object.keys(b)])){
    const o = a[id], n = b[id];
    if(!n){ out.push(`${o.farm}の出品が削除されました`); continue; }
    if(!o){ out.push(`${n.farm}が${q(n.qty,n.unit)}を新しく登録しました`); continue; }
    if(o.active && !n.active) out.push(`${n.farm}の${q(o.qty,o.unit)}が出荷不可になりました`);
    else if(!o.active && n.active) out.push(`${n.farm}が公開を再開しました`);
    if(o.qty !== n.qty) out.push(`${n.farm}が${q(o.qty,o.unit)}→${q(n.qty,n.unit)}に変更しました`);
    else if(o.v !== n.v && o.active === n.active) out.push(`${n.farm}が供給条件を変更しました`);

}
function suggest(r){
  const tries = [];
  if(!r.allowOff) tries.push(['規格外も含める', {allowOff:true}]);
  if(r.region) tries.push(['地域の指定を外す', {region:''}]);
  if(r.maxPrice != null) tries.push(['単価の上限を外す', {maxPrice:null}]);
  if(r.place) tries.push(['受渡場所の指定を外す', {place:''}]);
  if(r.dateMode === 'on') tries.push([`${fmtDate(r.deadline)}までの受渡しに広げる`, {dateMode:'by'}]);
  tries.push([`希望日を${fmtDate(shiftISO(r.deadline,1))}${r.dateMode==='by'?'まで':''}にする`, {deadline:shiftISO(r.deadline,1)}]);
  const out = [];
  for(const [label,patch] of tries){
    const res = allocate({...r,...patch});
    if(res.status === 'ok') out.push({label, patch, detail:`${q(r.qty,r.unit)}が成立（${res.best.picks.map(p=>p.farm).join('・')}、${yen(res.best.cost)}）`});
    if(out.length >= 3) break;
  }
  return out;
}

/* ---------- parsing ---------- */
const z2h = s => s.replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/ｋｇ|キロ(グラム)?/gi,'kg');
function nextWeekday(wd){ const d = today0(); let add = (wd - d.getDay() + 7) % 7; if(add === 0) add = 7; d.setDate(d.getDate()+add); return iso(d); }
function ruleParse(text){
  const t = z2h(text);
  const found = ITEMS.filter(i => t.includes(i));
  const items = found.filter(i => !(i === 'トマト' && found.includes('ミニトマト') && !t.replace(/ミニトマト/g,'').includes('トマト')));
  const m = t.match(/(\d+(?:\.\d+)?)\s*(kg|個|束)/i);
  let deadline = null;
  if(/しあさって/.test(t)) deadline = addDays(3);
  else if(/明後日|あさって/.test(t)) deadline = addDays(2);
  else if(/明日|あした/.test(t)) deadline = addDays(1);
  else if(/今日|本日/.test(t)) deadline = addDays(0);
  else { const md = t.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/); const w = t.match(/([月火水木金土日])曜/);
    if(md){ const d = today0(); d.setMonth(+md[1]-1, +md[2]); if(d < today0()) d.setFullYear(d.getFullYear()+1); deadline = iso(d); }
    else if(w) deadline = nextWeekday(WD.indexOf(w[1])); }
  const region = Object.keys(REGION_GROUPS).find(k => t.includes(k.replace('府','').replace('県',''))) || null;
  const pm = t.match(/(\d{2,5})\s*円/);
  let allowOff = null;
  if(/規格外\s*(は)?\s*(不可|NG|だめ|ダメ|なし)|形の?(きれい|良い|いい)/.test(t)) allowOff = false;
  else if(/形が?悪|不揃い|規格外|B品|訳あり|わけあり/.test(t)) allowOff = true;
  let out = null;
  if(/家庭|自宅|個人で/.test(t)) out = 'personal';
  else if(/全国|発送|宅配/.test(t)) out = 'nationwide';
  else if(items.length > 1) out = 'multi';
  return {item: items[0] || null, qty: m ? +m[1] : null, unit: m ? m[2].toLowerCase() : null, deadline,
    dateMode: deadline ? (/まで|以内/.test(t) ? 'by' : 'on') : null, region, maxPrice: pm ? +pm[1] : null,
    allowOff, place:null, outOfScope:out, unreadable: !items.length && !m};
}
function clean(p){
  p = p || {};
  const num = v => (typeof v === 'number' && isFinite(v) && v > 0) ? v : (typeof v === 'string' && isFinite(+v) && +v > 0 ? +v : null);
  return {
    item: ITEMS.includes(p.item) ? p.item : null,
    qty: num(p.qty) != null ? Math.min(num(p.qty), 200) : null,
    unit: UNITS.includes(p.unit) ? p.unit : 'kg',
    deadline: isISO(p.deadline) && p.deadline >= iso(today0()) ? p.deadline : null,
    dateMode: p.dateMode === 'on' ? 'on' : 'by',
    region: REGION_GROUPS[p.region] ? p.region : '',
    maxPrice: num(p.maxPrice),
    allowOff: p.allowOff === true,
    allowOffStated: p.allowOff === true || p.allowOff === false,
    place: PLACES.includes(p.place) ? p.place : '',
    outOfScope: ['personal','nationwide','multi'].includes(p.outOfScope) ? p.outOfScope : null,
    unreadable: p.unreadable === true
  };
}

/* ---------- restaurant: plan ---------- */
function slotLabel(key){ const [d,t,p] = key.split('|'); return {date:fmtDate(d), time:t.replace('-','〜'), place:p}; }
function reqChips(r){
  return [r.item, q(r.qty,r.unit), `${fmtDate(r.deadline)}${r.dateMode==='by'?'まで':''}`, r.region||'地域指定なし', r.allowOff?'規格外可':'規格外を含めない', r.maxPrice!=null?`${yen(r.maxPrice)}/${r.unit}まで`:null, r.place||null]
    .filter(Boolean).map(h).join('・');
}
// 候補ごとの「確認が必要な点」。登録データから言えることだけを書く
function planChecks(l, k){
  const out = [];
  if(!l.id) return out;
  if(l.grade === '規格外') out.push(`規格外（${l.reason}）を含みます。料理の用途に合うか確認してください`);
  if(l.surplus) out.push('余剰品として登録された供給です');
  if(k.amt < l.qty) out.push(`登録数量${q(l.qty,l.unit)}のうち${q(k.amt,l.unit)}を使う案です`);
  out.push('在庫は未確保・農家承認前です。数量・価格は取引相談で確認してください');
  return out;
}
function slipCards(p, unit){
  return p.picks.map(k => { const l = byId(k.id) || {}, checks = planChecks(l, k);
    return `<div class="fc"><div class="face" aria-hidden="true">👨‍🌾</div><div class="who">${h(k.farm)}<span>📍${h(l.region||'')}${l.variety?'・'+h(l.variety):''}</span></div>
      <div class="meta"><span>¥${(l.price||0).toLocaleString('ja-JP')}/${h(unit)}</span>${l.grade==='規格外'?`<span class="tag">規格外・${h(l.reason)}</span>`:''}${l.surplus?'<span class="tag">余剰</span>':''}</div>
      <div class="amt"><div><b>${+k.amt.toFixed(1)}</b><small>${h(unit)}</small></div><div class="yen">${yen(k.cost)}</div></div>
      ${checks.length ? `<div class="checks" style="grid-column:1/-1;margin-top:6px"><div class="t">確認が必要な点</div><ul>${checks.map(c => `<li>${h(c)}</li>`).join('')}</ul></div>` : ''}</div>`; }).join('');
}
function summarize(res, r){
  if(res.status === 'ok') return `${res.best.picks.map(p=>`${p.farm}${q(p.amt,r.unit)}`).join('＋')}＝${q(r.qty,r.unit)}・${yen(res.best.cost)}`;
  return res.partial ? `${r.item} 最大${q(res.partial.total,r.unit)}（${q(r.qty-res.partial.total,r.unit)}不足）` : `${r.item} 条件の合う出品なし`;
}
// 在庫が変わったら古い案を使えない状態にして、残りの在庫を含めて計算し直す
function refreshPlan(){
  const P = S.plan, now = snapshot(P.req.item), ch = diffSnap(P.snap, now);
  if(!ch.length) return;
  const old = summarize(P.result, P.req), oldNo = P.no;
  S.planSeq++;
  S.plan = {req:P.req, result:allocate(P.req), snap:now, no:planNo(), prev:{summary:old, changes:ch, no:oldNo}};
  save();
}
function planNo(){ const d = today0(); return `${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(S.planSeq)}`; }
function resultView(){
  const {req:r, result:res, prev} = S.plan, u = r.unit;
  const short = res.partial ? +(r.qty - res.partial.total).toFixed(1) : r.qty;
  let banner = '';
  if(prev){
    const tail = res.status === 'ok' ? `現在も${q(r.qty,u)}で成立します。組み合わせを更新しました。` : res.partial ? `現在の合計は${q(res.partial.total,u)}で${q(short,u)}不足です。` : '現在、条件の合う出品はありません。';
    banner = `<div class="msg err"><b>在庫が変わったため、案 No.${h(prev.no)} は使えません。</b><br>${h(prev.changes.join('。'))}。${h(tail)}</div>
      <div class="slip void"><div class="foot void-body"><span class="slip-no">旧案 No.${h(prev.no)}</span><span>${h(prev.summary)}</span></div></div>`;
  }
  let verdict, body = '';
  if(res.status === 'ok'){
    const s = slotLabel(res.best.slot);
    verdict = `🎉 条件を満たす${q(r.qty,u)}の仕入れ案が見つかりました`;
    body = `<dl class="sum">
        <div><dt>数量</dt><dd><span class="bigv">${+r.qty}<small>${h(u)}</small></span><span class="sub">希望どおり・${res.best.n}軒の組み合わせ</span></dd></div>
        <div><dt>受け渡し</dt><dd><b>${h(s.date)}</b> ${h(s.time)}<span class="sub">${h(s.place)}</span></dd></div>
        <div><dt>費用</dt><dd><span class="bigv">${res.best.cost.toLocaleString('ja-JP')}<small>円</small></span><span class="sub">税込・受渡手数料0円（デモ条件）</span></dd></div>
      </dl>
      <div class="slip-sec">つながる生産者さん</div>
      <div>${slipCards(res.best,u)}</div>
      <div class="total"><span>合計</span><span>${q(r.qty,u)}　${yen(res.best.cost)}</span></div>`;
  } else {
    verdict = {
      none: `条件に合う${r.item}の出品がありません`,
      short: `希望${q(r.qty,u)}に対し、条件の合う登録数量は${q(res.partial?.total||0,u)}。${q(short,u)}不足`,

  personal: 'このデモは地域の生産者と飲食店の仕入れ案づくりが対象です。家庭用・個人のご購入には対応していません。',
  nationwide: 'このデモは地域の生産者と飲食店の仕入れ案づくりが対象です。全国への配送・発送には対応していません。',
  multi: '1回の依頼で扱える品目は1つです。最初の品目で条件を整理しました。ほかの品目は、この案のあとに別の依頼として入力してください。'

async function doParse(){
  const text = $('#req-text').value.trim();
  S.draft.text = text;
  if(!text){ S.draft.note = '品目・数量・希望日を入力してください。上の例を選ぶか、「項目を選んで入力する」から続けられます。'; S.draft.noteKind='warn'; save(); render(); return; }
  if(text.length > 200){ S.draft.note = '200文字以内で入力してください。'; S.draft.noteKind='warn'; save(); render(); return; }
  busy = true; S.draft.note = ''; render();
  let parsed = null, note = '', kind = 'ok';
  let r = null;
  if(server.aiReady){ try { r = await api('/api/parse', {text}); } catch(e) {} }
  if(r && r.ok && r.data.parsed){ parsed = clean(r.data.parsed); note = '✨ AIが条件を整理しました。違うところは直してください。'; }
  if(!parsed){
    parsed = clean(ruleParse(text)); kind = 'warn';
    note = !server.aiReady ? '🔌 AIが未設定のため、簡易読み取りで項目を埋めました。項目を選んで続けられます。'
      : r && r.status === 429 ? 'AIの読み取りが短時間に集中したため、簡易読み取りで項目を埋めました。項目を選んで続けられます。'
      : 'AIに接続できなかったため、簡易読み取りで項目を埋めました。項目を選んで続けられます。';
  }
  busy = false;
  if(parsed.unreadable && !parsed.item && !parsed.qty){
    S.draft.note = '<b>条件を読み取れません。</b>品目・数量・希望日を含めて書き直すか、「項目を選んで入力する」から続けてください。'; S.draft.noteKind = 'err'; save(); render(); return;
  }
  if(parsed.outOfScope === 'personal' || parsed.outOfScope === 'nationwide'){
    S.draft.note = h(OUT_MSG[parsed.outOfScope]); S.draft.noteKind = 'warn'; save(); render(); return;
  }
  if(parsed.outOfScope === 'multi'){ note = OUT_MSG.multi + '<br>' + note; kind = 'warn'; }
  S.draft.req = parsed; S.draft.note = note; S.draft.noteKind = kind; S.step = 'confirm'; animate = true; save(); render();
}

function savePlan(){
  const P = S.plan; if(!P) return;
  if(S.saved.some(s => s.no === P.no)){ toast('この案はもう保存しています'); return; }
  const res = P.result, pick = res.best || res.partial;
  S.saved.unshift({
    no:P.no, at:Date.now(), req:P.req, status:res.status, summary:summarize(res, P.req),
    slot:pick ? pick.slot : null, cost:pick ? pick.cost : 0,
    picks:(pick ? pick.picks : []).map(k => ({id:k.id, farm:k.farm, amt:k.amt, cost:k.cost}))
  });
  S.saved = S.saved.slice(0, MAX_SAVED);
  save(); render();
  toast('📖 記録に保存しました。注文や在庫予約ではありません', {label:'記録を見る', run:()=>go('records')});
}
// 保存した案を、いまの在庫で計算し直して比べる
function checkSaved(s){
  if(s.req.deadline < iso(today0())) return {kind:'past'};
  const now = allocate(s.req), p = now.best || now.partial;
  const sig = picks => JSON.stringify((picks||[]).map(k => [k.id, k.amt]));
  const same = now.status === s.status && sig(p && p.picks) === sig(s.picks);
  return {kind: same ? 'same' : 'changed', summary: summarize(now, s.req), ok: now.status === 'ok'};
}

function validateStep(n, d){
  const e = [], num = v => +v;
  if(n === 1){
    if(!String(d.farm).trim() || String(d.farm).trim().length > 30) e.push('農家名を30文字以内で入力してください');
    else if(isDemoFarm(String(d.farm).trim()) && !(S.fdraft && S.fdraft.editId && (byId(S.fdraft.editId) || {}).demo)) e.push(`「${String(d.farm).trim()}」はデモ用の架空の農家名です。あなたの農家名を入力してください`);
    if(String(d.variety).length > 20) e.push('品種は20文字以内で入力してください');
    if(!ITEMS.includes(d.item)) e.push('食材を選んでください');
    if(!FARM_REGIONS.includes(d.region)) e.push('産地を選んでください');
    if(d.grade === '規格外' && !OFF_REASONS.includes(d.reason)) e.push('規格外の理由を選んでください');
  } else if(n === 2){
    if(!(num(d.qty) > 0 && num(d.qty) <= 999)) e.push('販売可能量は0より大きく999以下で入力してください');
    if(!UNITS.includes(d.unit)) e.push('単位を選んでください');
    if(!(num(d.minQty) > 0)) e.push('最低販売量は0より大きい数にしてください');
    if(!(num(d.step) >= 0.1)) e.push('販売刻みは0.1以上にしてください');
    if(num(d.minQty) > num(d.qty)) e.push('最低販売量が販売可能量より大きくなっています');
  } else if(n === 3){
    if(!(Number.isInteger(num(d.price)) && num(d.price) >= 1 && num(d.price) <= 100000)) e.push('単価は1〜100,000円の整数で入力してください');
  } else if(n === 4){
    if(!isISO(d.date) || d.date < iso(today0())) e.push('受け渡し日を今日以降で選んでください');
    if(!PLACES.includes(d.place)) e.push('受け渡し場所を選んでください');
    if(!d.from || !d.to || d.from >= d.to) e.push('時間の「から」を「まで」より前にしてください');
  }
  return e;
}

function confetti(){
  if(reduceMotion()) return;
  const colors = ['#8cc79a','#f3d77b','#f5b48a','#a98bc4','#f19a7f','#e9dcc2'];
  for(let i = 0; i < 36; i++){
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = (20 + Math.random()*60) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random()*160 - 80) + 'px');
    c.style.setProperty('--r', (Math.random()*720 - 360) + 'deg');
    c.style.animationDelay = (Math.random()*0.25) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

    save();
    const left = REQUIRED.filter(k => !filled(S.fdraft.d,k)).length, p = $('#w-left');
    if(p){ p.innerHTML = progressText(left); p.classList.toggle('done', !left); }
    const tot = $('#w-total'); if(tot) tot.innerHTML = totalText(S.fdraft.d);
    const wn = $('#w-warn'); if(wn) wn.innerHTML = warnHtml(S.fdraft.d);
    // 選択肢で見た目が変わる項目だけ描き直す（入力欄のchangeで描き直すと、直後の「次へ」のタップが消える）
    if(ev.type === 'change' && el.tagName === 'SELECT' && (el.dataset.f === 'grade' || el.dataset.f === 'item')) render();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', ev => {
  onField(ev);
  const el = ev.target;
  if(el.id === 'passcode'){ setPass(el.value.trim()); toast('🔑 パスコードをこの端末に保存しました'); return; }
  if(el.id === 'mk-item' || el.id === 'mk-region'){
    if(el.id === 'mk-item') marcheItem = el.value; else marcheRegion = el.value;
    el.classList.toggle('on', Boolean(el.value));
    const o = $('#mk-out'); if(o) o.innerHTML = marcheCards();
    return;
  }
  // 次回から：同じ農家名の前回の出品条件を読み込み、変更できるようにする
  if(el.id === 'f-farm' && S.fdraft){
    const prev = [...S.listings].reverse().find(l => l.farm === el.value.trim());
    if(!prev) return;
    for(const k of ['region','unit','place','from','to','minQty','step','item','variety','price']) S.fdraft.d[k] = prev[k];
    S.fdraft.d.farm = prev.farm;
    save(); render();
    toast(`${prev.farm}の前回の条件を読み込みました。必要なところを変えてください`);
  }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && sheetId){ closeSheet(); return; }
  if(ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.target.id === 'req-text'){
    ev.preventDefault(); doParse();
  }
});

load();
firstVisit = !S.visited;
S.visited = true;
save(); render();
fetchListings();
// 別の端末で在庫が変わったら、仕入れ案・ホーム・記録の画面に反映する
setInterval(() => { if(!document.hidden && server.loaded && !editing()) fetchListings({quiet:true}); }, 15000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && server.loaded) fetchListings({quiet:true}); });
})();
</script>
</body>
</html>
