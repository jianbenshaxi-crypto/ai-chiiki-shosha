<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI地域商社 — 関西の食材を、人と人でつなぐ地域マーケット</title>
<meta name="description" content="飲食店の「欲しい」と、農家の「売りたい」を、1つの仕入れ案にまとめる関西の地域マーケット。">
<meta name="theme-color" content="#f6f1e6">
<meta name="color-scheme" content="light only">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="地域商社">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Brand: 地域の食材と飲食店をつなぐ、次世代のフードマーケット
   深いグリーンとクリームが主役。トマト・かぼちゃ・若葉の色は、食材と数量の見せ方だけに使う。
   見出しと食材名は明朝で「食のブランド」らしく、本文はゴシック、数字はOutfit。ライトモード固定 */
:root{
  color-scheme:light;
  --bg:#f6f1e6; --card:#fffdf8; --beige:#efe8d9; --cream:#f7efdc; --ink:#21271f; --ink-2:#565d52; --ink-3:#898e82; --line:#e4dbc9;
  --green:#1d4d3a; --green-2:#286a4e; --green-ink:#fffdf6; --green-soft:#e1eadc; --green-pale:#edf2e8;
  --orange:#c4532f; --orange-soft:#fae6dc; --yellow:#e3a93c; --yellow-soft:#faefd6; --leaf:#7fae6a;
  --f:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-num:"Outfit","Zen Kaku Gothic New",sans-serif;
  --r-l:28px; --r:22px; --r-s:14px;
  --shadow:0 1px 2px rgba(40,35,20,.05),0 6px 18px -10px rgba(40,35,20,.14);
  --shadow-lift:0 24px 48px -22px rgba(29,77,58,.45),0 2px 6px rgba(40,35,20,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
  --nav:72px; --side:248px; --tint-mix:100%;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;font-size:15.5px;line-height:1.75;padding-inline:16px;padding-bottom:calc(var(--nav) + 44px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.4;font-weight:700;font-family:var(--f-head)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:3px}
::selection{background:var(--green-soft)}

/* type scale */
.page-title{font-family:var(--f-display);font-weight:800;font-size:29px;letter-spacing:.02em;line-height:1.35}
.page-title .t-emo{font-size:.8em;margin-left:.2em;vertical-align:.04em}
.lead{font-size:14.5px;color:var(--ink-2);margin-top:8px;max-width:36em}
.sec-title{font-size:18.5px;letter-spacing:.02em}
.display{font-family:var(--f-display);font-weight:800;letter-spacing:.02em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--green);text-transform:uppercase}
.cap{font-size:12.5px;color:var(--ink-3);line-height:1.65}
.muted{color:var(--ink-2)}
.page-h{padding-top:8px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.num,.price b,.pr b,.bigv,.amt b,.stat b{font-family:var(--f-num);font-weight:600;letter-spacing:.005em}

/* top bar (mobile) */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding-top:env(safe-area-inset-top,0px);margin-inline:-16px;padding-inline:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;max-width:760px;margin:0 auto}
.logo{font-family:var(--f-display);font-weight:800;font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:9px;letter-spacing:.02em}
.logo img{width:30px;height:30px;border-radius:9px}
.back{border:1px solid var(--line);background:var(--card);color:var(--green);font-weight:700;font-size:14.5px;padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:40px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav);padding-inline:6px}
nav.tabs .side-logo{display:none}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-3);cursor:pointer;padding:0;transition:color .2s;letter-spacing:.04em}
nav.tabs .emo{width:52px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:999px;transition:background .25s,color .25s}
nav.tabs .emo svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button[aria-current="page"]{color:var(--green)}
nav.tabs button[aria-current="page"] .emo{background:var(--green-soft)}

main{display:flex;flex-direction:column;gap:36px;padding-top:8px}
main.enter{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.soft{background:var(--green-pale);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14.5px}
.mini-list{display:flex;flex-direction:column;gap:10px}
.mini .t{font-weight:700}
.mini .s{font-size:12.5px;color:var(--ink-3)}
.mini.clickable{cursor:pointer;text-align:left;width:100%;transition:transform .2s,box-shadow .2s,border-color .2s}
.mini.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--green) 30%,var(--line))}

/* buttons: pill, one height scale (44 / 52 / 58) */
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:15px;line-height:1.4;color:var(--ink);transition:transform .12s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn:active,.chip:active,.role-tile:active{transform:scale(.97)}
.btn-main{background:var(--green);border-color:var(--green);color:var(--green-ink);padding:16px 24px;font-size:16px;width:100%;min-height:58px;box-shadow:0 10px 22px -10px color-mix(in srgb,var(--green) 70%,transparent)}
.btn-main:hover{background:var(--green-2);border-color:var(--green-2)}
.btn-sub{background:var(--green-soft);border-color:transparent;color:var(--green)}
.btn-sub:hover{border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.btn.small{padding:8px 16px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:wait}
.btn.danger{color:var(--orange);border-color:transparent;background:var(--orange-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.link{background:none;border:0;color:var(--green);font-weight:700;cursor:pointer;padding:4px 0;font-size:14.5px;text-align:left}
.link:hover{text-decoration:underline;text-underline-offset:4px}

/* badges */
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--beige);color:var(--ink-2);letter-spacing:.02em}
.tag.good{background:var(--green-soft);color:var(--green)}
.tag.hot{background:var(--orange-soft);color:var(--orange)}
.tag.sun{background:var(--yellow-soft);color:#7d5a0c}

/* messages */
.msg{border-radius:16px;padding:13px 16px;font-size:14.5px;background:var(--beige)}
.msg.warn,.msg.err{background:var(--orange-soft)}
.msg.warn b,.msg.err b{color:var(--orange)}
.msg.ok{background:var(--green-soft)}
.nw{display:inline-block}

/* ---------- home ---------- */
.hero{position:relative;border-radius:var(--r-l);padding:26px 22px 22px;background:var(--green);color:var(--cream);overflow:hidden;display:flex;flex-direction:column;gap:18px;isolation:isolate}
.hero::before{content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--yellow) 42%,transparent),transparent 66%);z-index:-1}
.hero::after{content:"";position:absolute;left:-120px;bottom:-160px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(127,174,106,.35),transparent 66%);z-index:-1}
.hero .brand-line{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-num);font-size:11px;font-weight:600;letter-spacing:.22em;color:rgba(247,239,220,.7)}
.hero .greet{white-space:nowrap;flex:none;font-family:var(--f);letter-spacing:.06em;font-size:12px;font-weight:700;color:var(--cream);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 11px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(23px,7.4vw,46px);line-height:1.28;letter-spacing:.03em;color:#fffdf6}
.hero h1 em{font-style:normal;color:#f3cf7a}
.hero .lead{color:rgba(247,239,220,.86);margin:0;max-width:24em;font-size:14.5px}
.hero .txt{display:flex;flex-direction:column;gap:12px;position:relative}
/* いま出品中の食材（登録データから） */
.hero-art{display:none}
.onsale{display:flex;flex-direction:column;gap:10px}
.onsale .cap{color:rgba(247,239,220,.7);font-weight:700;letter-spacing:.06em}
.onsale-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-22px;padding-inline:22px;scroll-snap-type:x proximity}
.onsale-row::-webkit-scrollbar{display:none}
.produce-chip{flex:none;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;background:var(--cream);color:var(--ink);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:14px;scroll-snap-align:start;transition:transform .2s var(--ease),background .2s}
.produce-chip:hover{transform:translateY(-2px);background:#fff}
.produce-chip .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:color-mix(in srgb,var(--t) 100%,#fff)}
.produce-chip small{font-family:var(--f-num);font-size:12px;color:var(--ink-3);font-weight:600}

/* どちらで使いますか？：同じ大きさ・同じ構成の2枚を左右対称に */
.roles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;border-radius:var(--r);padding:18px 16px 16px;min-height:196px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .25s,border-color .2s}
.role-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--green) 25%,var(--line))}
.role-tile .role-k{font-family:var(--f-num);font-size:10.5px;font-weight:600;letter-spacing:.2em;color:var(--ink-3);white-space:nowrap}
.role-tile .role-ic{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.role-tile .role-t{font-family:var(--f-display);font-weight:800;font-size:clamp(14px,4.3vw,19px);line-height:1.4;letter-spacing:.01em;white-space:normal;overflow-wrap:break-word}
.role-tile .role-s{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-top:auto}
.role-tile .role-go{position:absolute;right:14px;bottom:14px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--green);color:var(--green-ink);font-size:17px;font-weight:700;transition:transform .2s var(--ease)}
.role-tile:hover .role-go{transform:translateX(3px)}
.role-tile.shop .role-ic{background:var(--orange-soft)}
.role-tile.farm .role-ic{background:var(--green-soft)}
@media (max-width:360px){.role-tile{padding:16px 13px 14px}.role-tile .role-t{font-size:13.5px}.role-tile .role-k{letter-spacing:.06em;font-size:9.5px}}

/* 使い方の流れ（カードで囲まず、番号の付いた横並び） */
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;counter-reset:hw}
.howto li{counter-increment:hw;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.45;padding-top:12px;border-top:2px solid var(--line)}
.howto li::before{content:counter(hw,decimal-leading-zero);font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--green);letter-spacing:.06em}
.howto li.key{border-top-color:var(--yellow)}
.howto li.key::before{color:#a8741a}
.howto li:first-child{border-top-color:var(--green)}
@media (max-width:360px){.howto{gap:6px}.howto li{font-size:11px}}

/* 数字で見る供給 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:36px;line-height:1.1;color:var(--green)}
.stat b small{font-size:14px;margin-left:3px;color:var(--ink-2);font-family:var(--f)}
.stat span{font-size:12.5px;color:var(--ink-2);font-weight:700}

/* produce placeholder：写真がないので、食材の色を背景にしたイラストで見せる */
.produce{position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 30% 20%,#fff 0%,color-mix(in srgb,var(--t) 70%,#fff) 42%,color-mix(in srgb,var(--t) 100%,#f0e6d6) 100%);overflow:hidden}
.produce::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.3px);background-size:18px 18px;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);pointer-events:none}
.produce>span[aria-hidden]{filter:drop-shadow(0 14px 18px rgba(80,50,20,.22));line-height:1}

/* marché cards（一覧・プレビュー） */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.mcard .img{position:relative;aspect-ratio:4/3;font-size:56px}
.mcard .img .tags{position:absolute;left:10px;top:10px;right:10px;z-index:1}
.mcard .img .tag{background:rgba(255,255,255,.9);backdrop-filter:blur(4px)}
.mcard .img .tag.good{color:var(--green)}
.mcard .img .tag.hot{color:var(--orange)}
.mcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard h3{font-size:18px;line-height:1.35}
.mcard h3 small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:6px;font-family:var(--f)}
.where{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 12px}
.mcard .where{flex-direction:column;gap:0}
.mcard .pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:auto;flex-wrap:wrap}
.mcard .pr b{font-size:20px}
.mcard .pr .left{font-size:12.5px;color:var(--ink-2);font-weight:700}
.mcard .pr .left.hot{color:var(--orange)}
.mcard .go{margin-top:6px;width:100%;padding:8px 10px;font-size:13px}
.mcard .hand{font-size:12.5px;color:var(--ink-2)}
.price{white-space:nowrap}
.price b{font-size:24px}
.price span{font-size:13px;color:var(--ink-3)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:62%;gap:12px;overflow-x:auto;padding:4px 16px 10px;margin-inline:-16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}

/* ---------- 食材をさがす：スワイプデッキ ---------- */
.deck-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.deck{position:relative;width:100%;max-width:390px;height:clamp(470px,62vh,560px);touch-action:pan-y}
.swipe-card{position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:column;background:var(--card);border-radius:30px;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;text-align:left;border:1px solid var(--line);box-shadow:var(--shadow-lift);transition:transform .34s var(--ease),opacity .3s ease}
.swipe-card:not(.behind){animation:cardIn .42s var(--ease) both}
@keyframes cardIn{from{transform:scale(.94) translateY(16px);opacity:.85}to{transform:none;opacity:1}}
.swipe-card:active{cursor:grabbing}
.swipe-card.behind{transform:scale(.94) translateY(16px);box-shadow:var(--shadow);opacity:.85;pointer-events:none}
.swipe-card.behind .peek{display:none}
.swipe-card.lift{box-shadow:0 30px 60px -24px rgba(29,77,58,.5);cursor:grabbing}
.swipe-card .img{flex:1;min-height:0;font-size:140px}
.swipe-card .img .tags{position:absolute;left:16px;top:16px;right:16px;z-index:1}
.swipe-card .img .tag{background:rgba(255,253,248,.92);backdrop-filter:blur(4px);font-size:12.5px;padding:4px 12px}
.swipe-card .img .tag.hot{color:var(--orange)}
.swipe-card .peek{position:absolute;right:14px;bottom:14px;z-index:1;font-size:12px;font-weight:700;color:var(--ink-2);background:rgba(255,253,248,.92);border-radius:999px;padding:5px 12px;backdrop-filter:blur(4px)}
.swipe-card .body{padding:18px 20px 52px;display:flex;flex-direction:column;gap:14px;flex:none}
.swipe-card h3{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.15;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.swipe-card h3 small{font-family:var(--f);font-size:14px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.grower{display:flex;align-items:center;gap:10px;margin-top:-4px}
.grower .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--green);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.grower b{display:block;font-size:14.5px;line-height:1.3}
.grower small{display:block;font-size:12px;color:var(--ink-3);font-weight:700}
.swipe-card .spec{display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:0;margin:0;background:var(--bg);border-radius:16px;overflow:hidden}
.swipe-card .spec div{padding:10px 12px;min-width:0;position:relative}
.swipe-card .spec div+div::before{content:"";position:absolute;left:0;top:12px;bottom:12px;border-left:1px solid var(--line)}
.swipe-card .spec dt{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.swipe-card .spec dd{margin:0;font-size:15px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swipe-card .spec dd .num{font-size:19px}
.swipe-card .spec dd small{font-size:11.5px;color:var(--ink-3);font-weight:700;margin-left:1px}

<script>
(() => {
const KEY = 'ai-chiiki-shosha-v1';
const ITEMS = ['ミニトマト','トマト','なす','きゅうり','ピーマン','万願寺とうがらし','玉ねぎ','じゃがいも','小松菜','ほうれん草','キャベツ','大根'];
const UNITS = ['kg','個','束'];
const REGION_GROUPS = {
  '大阪近郊':['大阪市','北摂','能勢・豊能','北河内','中河内','南河内','泉州'],
  '北摂':['北摂','能勢・豊能'],
  '能勢・豊能':['能勢・豊能'],
  '大阪市':['大阪市'],
  '京都府':['京都府'],
  '兵庫県':['兵庫県']
};
const FARM_REGIONS = ['能勢・豊能','北摂','大阪市','北河内','中河内','南河内','泉州','京都府','兵庫県','奈良県'];
const PLACES = ['拠点P（豊中・共通受渡拠点）','拠点Q（能勢・道の駅）','亀岡集荷所'];
// 成約手数料は未確定・未実装。仕入れ案の費用から「参考値」を計算するためだけの仮の料率（実際の請求はしない）
const COMMISSION_RATE_REF = 0.05;
// 受け渡し拠点のおおよその位置（町名からの参考値。正確な建物の住所ではない）
const PLACE_COORDS = {
  '拠点P（豊中・共通受渡拠点）': { lat: 34.78, lng: 135.47 },
  '拠点Q（能勢・道の駅）': { lat: 34.95, lng: 135.47 },
  '亀岡集荷所': { lat: 35.01, lng: 135.58 },
};
// 2点間のおおよその距離（km）。Haversine公式
function distanceKm(a, b){
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const x = Math.sin(dLat/2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
const OFF_REASONS = ['形の不揃い','サイズ不揃い','色むら','軽い表面傷'];
const TABS = ['home','shop','farm','records','settings','login'];
const ROLE_LABEL = {farm:'農家', shop:'飲食店'};
const MAX_SAVED = 30;
// AIの接続状態。未設定なのに使えるように見せない
function aiStatus(){
  return server.aiReady ? '<span class="ai-on">AI接続中</span>'
    : `<div class="ai-off"><span aria-hidden="true">🔌</span><span><b>AIはまだ設定されていません。</b>管理者がAPIキー（GEMINI_API_KEY）を設定すると、AIが仕入れの希望文を読み取ります。いまは簡易読み取りで項目を埋め、項目を選んで続けられます。</span></div>`;
}
const ART = {'ミニトマト':'🍅','トマト':'🍅','なす':'🍆','きゅうり':'🥒','ピーマン':'🫑','万願寺とうがらし':'🌶️','玉ねぎ':'🧅','じゃがいも':'🥔','小松菜':'🥬','ほうれん草':'🥬','キャベツ':'🥬'};
const TINT = {'ミニトマト':'#fde1d8','トマト':'#fde1d8','なす':'#ece2f4','きゅうり':'#e2f0da','ピーマン':'#e2f0da','万願寺とうがらし':'#e6f1d6','玉ねぎ':'#faebd3','じゃがいも':'#f5e8d2','小松菜':'#e2f0da','ほうれん草':'#e2f0da','キャベツ':'#e8f3e0','大根':'#eef4ea'};
const DAIKON = '<svg viewBox="0 0 64 64" width="1em" height="1em" aria-hidden="true"><path d="M32 4c-4 6-12 6-14 2 2 8 8 12 14 12 6 0 12-4 14-12-2 4-10 4-14-2z" fill="#6aa86e"/><path d="M22 18h20c2 12-2 30-10 42-8-12-12-30-10-42z" fill="#fbfaf4" stroke="#d9d2c0" stroke-width="2"/></svg>';
const art = item => ART[item] || (item === '大根' ? DAIKON : '🥕');
const tint = item => TINT[item] || '#f4ecdc';

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = n => { const d = today0(); d.setDate(d.getDate()+n); return iso(d); };
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const shiftISO = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const daysUntil = s => Math.round((parseISO(s)-today0())/864e5);
const WD = '日月火水木金土';
const rel = s => ({0:'今日',1:'明日',2:'明後日'})[daysUntil(s)] || '';
const fmtDate = s => { if(!s) return ''; const d = parseISO(s); const r = rel(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})${r?' '+r:''}`; };
const fmtStamp = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtAgo = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'たった今' : m < 60 ? `${m}分前` : m < 1440 ? `${Math.round(m/60)}時間前` : `${Math.round(m/1440)}日前`; };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => n.toLocaleString('ja-JP') + '円';
const q = (n,u) => `${+(+n).toFixed(1)}${u}`;
const opt = (list, sel, blank) => (blank!=null?`<option value="">${h(blank)}</option>`:'') + list.map(v => `<option${v===sel?' selected':''}>${h(v)}</option>`).join('');
const placeShort = p => String(p).replace(/（.*）/, '');
const pageHead = (title, lead) => `<header class="page-h"><h1 class="page-title">${String(title).replace(/\s*((?:\p{Extended_Pictographic}|\uFE0F|\u200D)+)\s*$/u, '<span class="t-emo" aria-hidden="true">$1</span>')}</h1>${lead ? `<p class="lead">${h(lead)}</p>` : ''}</header>`;
const lowStock = l => l.qty <= Math.max(2 * l.minQty, 2);
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- state ---------- */
// 出品・在庫はサーバー（/api/listings）が持ち、全端末で共有する。
// 画面の位置・下書き・作った仕入れ案・保存した案はこの端末のブラウザに保存する。
const DEFAULT_TEXT = '明後日までに大阪近郊のトマトを10kg、多少形が悪くてもOK';
const PASS_KEY = 'ai-chiiki-shosha-pass';
function freshState(){ return {listings:[], planSeq:0, tab:'home', step:'input', draft:{text:DEFAULT_TEXT, req:null, note:''}, plan:null, saved:[], liked:[], fdraft:null, visited:false}; }
let S, server = {loaded:false, editLocked:false, shared:true, aiReady:false, error:''};
function load(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch(e) { raw = null; }
  const base = freshState();
  // 旧版の保存データは、いま使う項目だけを引き継ぐ
  S = raw && raw.draft ? {...base, ...Object.fromEntries(Object.keys(base).filter(k => k in raw).map(k => [k, raw[k]]))} : base;
  if(!TABS.includes(S.tab)) S.tab = 'home';
  if(!['input','confirm','result'].includes(S.step)) S.step = 'input';
  if(!Array.isArray(S.saved)) S.saved = [];
  if(!Array.isArray(S.liked)) S.liked = [];
  if(S.fdraft && !S.fdraft.d) S.fdraft = null;
  if(S.fdraft){
    const fd = FD();
    S.fdraft = {step:S.fdraft.step, editId:S.fdraft.editId, d:Object.fromEntries(Object.keys(fd).map(k => [k, k in S.fdraft.d ? S.fdraft.d[k] : fd[k]]))};
    if(!(S.fdraft.step >= 1 && S.fdraft.step <= 5)) S.fdraft.step = 1;
  }
  S.listings = [];
}
// 共有データ（出品・在庫）はサーバーが正。この端末には保存しない
function save(){ try { const {listings, _sugg, ...rest} = S; localStorage.setItem(KEY, JSON.stringify(rest)); } catch(e) {} }
function applyData(d){ S.listings = d.listings || []; }
const getPass = () => { try { return localStorage.getItem(PASS_KEY) || ''; } catch(e) { return ''; } };
const setPass = v => { try { localStorage.setItem(PASS_KEY, v); } catch(e) {} };
// ログイン状態。この端末にはトークンだけを保存し、誰でログインしているかは毎回サーバーに確かめる
const SESSION_KEY = 'ai-chiiki-shosha-session';
const getToken = () => { try { return localStorage.getItem(SESSION_KEY) || ''; } catch(e) { return ''; } };
const setToken = v => { try { if(v) localStorage.setItem(SESSION_KEY, v); else localStorage.removeItem(SESSION_KEY); } catch(e) {} };
let me = null, auth = {needsPasscode:false}, loginMode = 'login', signupRole = 'farm', authDraft = {};
// 出品を変更できるか：パスコード未設定（ローカル確認）・管理者・自分の出品
const canEdit = l => !server.editLocked || Boolean(getPass()) || Boolean(l.own);
// ログインした農家は、アカウントの農家名で出品する
const farmLocked = () => Boolean(me && me.role === 'farm' && !getPass());
async function fetchMe(){
  let r = null;
  try { r = await api('/api/auth'); } catch(e) {}
  if(!r || !r.ok) return;
  me = r.data.user; auth = {needsPasscode:Boolean(r.data.signupNeedsPasscode)};
  if(!me && getToken()) setToken('');
}

/* ---------- server data ---------- */
async function api(path, body){
  const headers = {'Content-Type':'application/json'};
  const pc = getPass(); if(body && pc) headers['x-edit-passcode'] = pc;
  const tk = getToken(); if(tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(path, {method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined, cache:'no-store'});
  let data = {}; try { data = await res.json(); } catch(e) {}
  return {ok:res.ok, status:res.status, data};
}
// 入力中のフォームがある画面は、裏での在庫更新で描き直さない
const editing = () => (S.tab === 'shop' && S.step !== 'result') || (S.tab === 'farm' && S.fdraft) || S.tab === 'settings' || S.tab === 'login' || Boolean(sheetId);
async function fetchListings(opts){
  let r = null;
  try { r = await api('/api/listings'); } catch(e) {}
  if(!r || !r.ok){ server.error = 'データを読み込めませんでした。通信状態を確かめて、もう一度読み込んでください。'; if(!opts?.quiet || !server.loaded) render(); return; }
  applyData(r.data);
  const first = !server.loaded;
  server = {loaded:true, editLocked:Boolean(r.data.editLocked), shared:Boolean(r.data.shared), aiReady:Boolean(r.data.aiReady), error:''};
  if(opts?.quiet && !first && editing()) return;
  render();
}
async function mutate(body){
  let r = null;
  try { r = await api('/api/listings', body); } catch(e) {}
  if(!r){ toast('通信できませんでした。もう一度試してください'); return null; }
  if(r.status === 401){ toast('ログインしてから操作してください'); go('login'); return null; }
  if(!r.ok){ toast(`${r.data.error || '保存できませんでした'}（エラーコード ${r.status}）`, null, 'err'); return null; }
  applyData(r.data);
  return r.data;
}
const byId = id => S.listings.find(l => l.id === id);
const isDemoFarm = name => S.listings.some(l => l.demo && l.farm === name);
const openListings = () => S.listings.filter(l => l.active && l.qty > 0 && l.date >= iso(today0()));

/* ---------- allocation (deterministic) ---------- */
const SC = 10; // 0.1単位で計算する
function reasonsFor(l, r){
  const out = [];
  if(!l.active) out.push('公開停止中（出荷不可）');
  if(l.qty <= 0) out.push('在庫なし');
  if(l.unit !== r.unit) out.push(`単位が${l.unit}のため組み合わせられない`);
  const lo = iso(today0());
  if(r.dateMode === 'on' ? l.date !== r.deadline : (l.date > r.deadline || l.date < lo)) out.push(`受渡日${fmtDate(l.date)}が希望日に合わない`);
  if(r.region && !(REGION_GROUPS[r.region]||[]).includes(l.region)) out.push(`地域が対象外（${l.region}）`);
  if(l.grade === '規格外' && !r.allowOff) out.push(`規格外（${l.reason}）は含めない指定`);
  if(r.maxPrice != null && l.price > r.maxPrice) out.push(`単価${yen(l.price)}が上限を超える`);
  if(r.place && l.place !== r.place) out.push(`受渡場所が違う（${l.place}）`);
  if(l.active && l.qty > 0 && l.minQty > l.qty) out.push('在庫が最低販売量に届かない');
  return out;
}
const slotKey = l => `${l.date}|${l.from}-${l.to}|${l.place}`;
const better = (a,b) => a.n !== b.n ? a.n < b.n : a.cost !== b.cost ? a.cost < b.cost : a.key < b.key;
function solve(ls, T, key){
  let dp = new Map([[0,{n:0,cost:0,picks:[],key}]]);
  for(const l of ls){
    const min = Math.round(l.minQty*SC), step = Math.max(1, Math.round(l.step*SC)), cap = Math.round(l.qty*SC);
    const opts = [];
    for(let a = min; a <= cap && a <= T; a += step) opts.push(a);
    const nd = new Map(dp);
    for(const [t,e] of dp) for(const a of opts){
      const nt = t + a; if(nt > T) break;
      const c = Math.round(a/SC*l.price);
      const cand = {n: e.picks.some(p => p.farm === l.farm) ? e.n : e.n+1, cost:e.cost+c, picks:[...e.picks,{id:l.id,farm:l.farm,amt:a/SC,cost:c}], key};
      const cur = nd.get(nt);
      if(!cur || better(cand,cur)) nd.set(nt,cand);
    }
    dp = nd;
  }
  dp.delete(0);
  return dp;
}
function allocate(r){
  const T = Math.round(r.qty*SC);
  const related = S.listings.filter(l => l.item === r.item);
  const elig = [], excluded = [];
  for(const l of related){ const rs = reasonsFor(l,r); rs.length ? excluded.push({id:l.id, reasons:rs}) : elig.push(l); }
  const slots = new Map();
  for(const l of elig){ const k = slotKey(l); if(!slots.has(k)) slots.set(k,[]); slots.get(k).push(l); }
  let best = null, partial = null, maxSlotSum = 0;
  for(const [k,ls] of slots){
    maxSlotSum = Math.max(maxSlotSum, ls.reduce((s,l)=>s+Math.round(l.qty*SC),0));
    const dp = solve(ls,T,k);
    const ex = dp.get(T);
    if(ex && (!best || better(ex,best))) best = {...ex, total:T};
    let mx = 0; for(const t of dp.keys()) if(t > mx) mx = t;
    if(mx){ const e = {...dp.get(mx), total:mx}; if(!partial || mx > partial.total || (mx === partial.total && better(e,partial))) partial = e; }
  }
  const sumAll = elig.reduce((s,l)=>s+Math.round(l.qty*SC),0);
  let status;
  if(best) status = 'ok';
  else if(!elig.length) status = 'none';
  else if(maxSlotSum >= T) status = 'step';
  else if(sumAll >= T && slots.size > 1) status = 'slot';
  else status = 'short';
  const conv = p => p && {slot:p.key, picks:p.picks, total:p.total/SC, cost:p.cost, n:p.n};
  return {status, best:conv(best), partial:conv(partial), excluded, eligCount:elig.length, relatedCount:related.length};
}
function snapshot(item){
  const o = {};
  for(const l of S.listings.filter(l => l.item === item)) o[l.id] = {farm:l.farm, qty:l.qty, unit:l.unit, active:l.active, v:l.v};
  return o;
}
function diffSnap(a, b){
  const out = [];
  for(const id of new Set([...Object.keys(a),...Object.keys(b)])){
    const o = a[id], n = b[id];
    if(!n){ out.push(`${o.farm}の出品が削除されました`); continue; }
    if(!o){ out.push(`${n.farm}が${q(n.qty,n.unit)}を新しく登録しました`); continue; }
    if(o.active && !n.active) out.push(`${n.farm}の${q(o.qty,o.unit)}が出荷不可になりました`);
    else if(!o.active && n.active) out.push(`${n.farm}が公開を再開しました`);
    if(o.qty !== n.qty) out.push(`${n.farm}が${q(o.qty,o.unit)}→${q(n.qty,n.unit)}に変更しました`);
    else if(o.v !== n.v && o.active === n.active) out.push(`${n.farm}が供給条件を変更しました`);
  }
  return out;
}
function suggest(r){
  const tries = [];
  if(!r.allowOff) tries.push(['規格外も含める', {allowOff:true}]);
  if(r.region) tries.push(['地域の指定を外す', {region:''}]);
  if(r.maxPrice != null) tries.push(['単価の上限を外す', {maxPrice:null}]);
  if(r.place) tries.push(['受渡場所の指定を外す', {place:''}]);
  if(r.dateMode === 'on') tries.push([`${fmtDate(r.deadline)}までの受渡しに広げる`, {dateMode:'by'}]);
  tries.push([`希望日を${fmtDate(shiftISO(r.deadline,1))}${r.dateMode==='by'?'まで':''}にする`, {deadline:shiftISO(r.deadline,1)}]);
  const out = [];
  for(const [label,patch] of tries){
    const res = allocate({...r,...patch});
    if(res.status === 'ok') out.push({label, patch, detail:`${q(r.qty,r.unit)}が成立（${res.best.picks.map(p=>p.farm).join('・')}、${yen(res.best.cost)}）`});
    if(out.length >= 3) break;
  }
  return out;
}

/* ---------- parsing ---------- */
const z2h = s => s.replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/ｋｇ|キロ(グラム)?/gi,'kg');
function nextWeekday(wd){ const d = today0(); let add = (wd - d.getDay() + 7) % 7; if(add === 0) add = 7; d.setDate(d.getDate()+add); return iso(d); }
function ruleParse(text){
  const t = z2h(text);
  const found = ITEMS.filter(i => t.includes(i));
  const items = found.filter(i => !(i === 'トマト' && found.includes('ミニトマト') && !t.replace(/ミニトマト/g,'').includes('トマト')));
  const m = t.match(/(\d+(?:\.\d+)?)\s*(kg|個|束)/i);
  let deadline = null;
  if(/しあさって/.test(t)) deadline = addDays(3);
  else if(/明後日|あさって/.test(t)) deadline = addDays(2);
  else if(/明日|あした/.test(t)) deadline = addDays(1);
  else if(/今日|本日/.test(t)) deadline = addDays(0);
  else { const md = t.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/); const w = t.match(/([月火水木金土日])曜/);
    if(md){ const d = today0(); d.setMonth(+md[1]-1, +md[2]); if(d < today0()) d.setFullYear(d.getFullYear()+1); deadline = iso(d); }
    else if(w) deadline = nextWeekday(WD.indexOf(w[1])); }
  const region = Object.keys(REGION_GROUPS).find(k => t.includes(k.replace('府','').replace('県',''))) || null;
  const pm = t.match(/(\d{2,5})\s*円/);
  let allowOff = null;
  if(/規格外\s*(は)?\s*(不可|NG|だめ|ダメ|なし)|形の?(きれい|良い|いい)/.test(t)) allowOff = false;
  else if(/形が?悪|不揃い|規格外|B品|訳あり|わけあり/.test(t)) allowOff = true;
  let out = null;
  if(/家庭|自宅|個人で/.test(t)) out = 'personal';
  else if(/全国|発送|宅配/.test(t)) out = 'nationwide';
  else if(items.length > 1) out = 'multi';
  return {item: items[0] || null, qty: m ? +m[1] : null, unit: m ? m[2].toLowerCase() : null, deadline,
    dateMode: deadline ? (/まで|以内/.test(t) ? 'by' : 'on') : null, region, maxPrice: pm ? +pm[1] : null,
    allowOff, place:null, outOfScope:out, unreadable: !items.length && !m};
}
function clean(p){
  p = p || {};
  const num = v => (typeof v === 'number' && isFinite(v) && v > 0) ? v : (typeof v === 'string' && isFinite(+v) && +v > 0 ? +v : null);
  return {
    item: ITEMS.includes(p.item) ? p.item : null,
    qty: num(p.qty) != null ? Math.min(num(p.qty), 200) : null,
    unit: UNITS.includes(p.unit) ? p.unit : 'kg',
    deadline: isISO(p.deadline) && p.deadline >= iso(today0()) ? p.deadline : null,
    dateMode: p.dateMode === 'on' ? 'on' : 'by',
    region: REGION_GROUPS[p.region] ? p.region : '',
    maxPrice: num(p.maxPrice),
    allowOff: p.allowOff === true,
    allowOffStated: p.allowOff === true || p.allowOff === false,
    place: PLACES.includes(p.place) ? p.place : '',
    outOfScope: ['personal','nationwide','multi'].includes(p.outOfScope) ? p.outOfScope : null,
    unreadable: p.unreadable === true
  };
}

function placeDistText(place){
  if(!myCoords) return null;
  const c = PLACE_COORDS[place];
  if(!c) return null;
  const km = distanceKm(myCoords, c);
  return `${placeShort(place)}まで約${km < 10 ? km.toFixed(1) : Math.round(km)}km`;
}
// 表示順：条件に合うものだけに絞ったうえで、
// ・現在地から近い順を選んでいるときはその並びをそのまま優先する（本人が選んだ並びを崩さない）

function marcheList(){
  const open = openListings();
  let filtered = open.filter(l => (!marcheItem || l.item === marcheItem) && (!marcheRegion || (REGION_GROUPS[marcheRegion] || []).includes(l.region)));
  if(myCoords){
    const dist = l => PLACE_COORDS[l.place] ? distanceKm(myCoords, PLACE_COORDS[l.place]) : Infinity;
    filtered = [...filtered].sort((a,b) => dist(a) - dist(b));
  } else {
    filtered = [...filtered].sort((a,b) => (b.boostRequested ? 1 : 0) - (a.boostRequested ? 1 : 0));

}

function advanceDeck(dir){
  const deck = $('#mk-deck');
  const front = deck && deck.querySelector('.swipe-card:not(.behind)');
  const behind = deck && deck.querySelector('.swipe-card.behind');
  const commit = () => {
    marcheIdx++;
    if(front) front.remove();
    if(behind){
      behind.classList.remove('behind', 'lift');
      behind.removeAttribute('aria-hidden');
      behind.style.pointerEvents = '';

      if(nx) deck.insertAdjacentHTML('afterbegin', swipeCard(nx, true));
      const cnt = $('.deck-count'); if(cnt) cnt.outerHTML = deckCountHtml(list);
      bindDeck();
    } else {

    }
  };
  if(dir && front){
    front.style.transform = `translateX(${dir*600}px) rotate(${dir*22}deg)`;
    front.style.opacity = '0';
    setTimeout(commit, 260);
  } else commit();
}

// カードのドラッグ操作。縦スクロールは妨げず（touch-action:pan-y）、横方向だけ追従させる。
function bindDeck(){
  const card = document.querySelector('#mk-deck .swipe-card:not(.behind)');
  if(!card) return;
  const likeStamp = card.querySelector('[data-stamp="like"]');
  const skipStamp = card.querySelector('[data-stamp="skip"]');
  const THRESHOLD = 100;
  let dragging = false, moved = false, startX = 0, startY = 0, dx = 0;
  card.addEventListener('pointerdown', (e) => {
    dragging = true; moved = false; startX = e.clientX; startY = e.clientY; dx = 0;
    card.style.transition = 'none';
    card.classList.add('lift');
    try { card.setPointerCapture(e.pointerId); } catch(err) {}
  });
  card.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    dx = e.clientX - startX;
    if(Math.abs(dx) > 6 || Math.abs(e.clientY - startY) > 6) moved = true;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    if(likeStamp) likeStamp.style.opacity = String(Math.max(0, Math.min(1, dx / THRESHOLD)));
    if(skipStamp) skipStamp.style.opacity = String(Math.max(0, Math.min(1, -dx / THRESHOLD)));
  });
  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    card.style.transition = '';
    card.classList.remove('lift');
    if(dx > THRESHOLD) likeCurrent(true);
    else if(dx < -THRESHOLD) skipCurrent(true);
    else {
      card.style.transform = '';
      if(likeStamp) likeStamp.style.opacity = '0';
      if(skipStamp) skipStamp.style.opacity = '0';
      if(!moved) openListingSheet(card.dataset.swipeId);
    }
  };
  card.addEventListener('pointerup', onUp);
  card.addEventListener('pointercancel', onUp);
}

// 1食あたりの使用量の一般的な目安（g）。料理・切り方で大きく変わるため、必要量は「目安」と表示する
const GRAMS = {'ミニトマト':50,'トマト':80,'なす':80,'きゅうり':50,'ピーマン':40,'万願寺とうがらし':40,'玉ねぎ':50,'じゃがいも':100,'小松菜':50,'ほうれん草':50,'キャベツ':60,'大根':80};
function openMenu(ids){ menuSel = [...new Set(ids)].filter(id => byId(id)); menuAI = null; sheetMode = 'menu'; sheetId = 'menu'; renderSheet(); }
// 食数から必要量の目安を出し、登録在庫と比べる（kg以外の単位は計算しない）
function menuQtyNote(item, l){
  const n = +menuServ;
  if(!(n > 0)) return '';
  const need = Math.round(n * (GRAMS[item] || 0) / 100) / 10;
  if(!l) return `<span class="cap qty-note">必要量の目安 約${q(need, 'kg')}（${n}食×約${GRAMS[item]}g）→ <b>登録商品なし・全量不足</b></span>`;
  if(l.unit !== 'kg') return `<span class="cap qty-note">必要量の目安 約${q(need, 'kg')}（出品は${h(l.unit)}単位のため、足りるかは未確認）</span>`;
  return need <= l.qty ? `<span class="cap qty-note">必要量の目安 約${q(need, 'kg')} ≦ 在庫${q(l.qty, 'kg')} → <b>足りる見込み</b></span>`
    : `<span class="cap qty-note" style="color:var(--orange)">必要量の目安 約${q(need, 'kg')} ＞ 在庫${q(l.qty, 'kg')} → <b>約${q(need - l.qty, 'kg')}不足</b>（ほかの農家と組み合わせが必要）</span>`;
}
// 登録食材の原価の目安（1食あたり）＝ 一般的な使用量の目安(g) × 登録単価(円/kg)。kg以外の単位・出品のない食材は計算しない
function menuCost(needs, sel, avail){
  const parts = [], skip = [];
  for(const i of needs){
    const l = sel.find(x => x.item === i) || avail(i);
    if(!l) { skip.push(`${i}（出品なし）`); continue; }
    if(l.unit !== 'kg') { skip.push(`${i}（${l.unit}単位のため）`); continue; }
    parts.push({i, farm:l.farm, yen:GRAMS[i] / 1000 * l.price});
  }
  if(!parts.length) return '';
  const per = parts.reduce((s, p) => s + p.yen, 0), n = +menuServ;
  return `<div class="facts-box"><div class="t">💴 登録食材の原価の目安（1食あたり）</div>
    <b style="font-size:18px">約${yen(Math.round(per))}</b>${n > 0 ? `　<span class="cap">${n}食で約${yen(Math.round(per * n))}</span>` : ''}
    <div class="cap">${parts.map(p => `${h(p.i)} 約${yen(Math.round(p.yen))}（${GRAMS[p.i]}g×登録単価・${h(p.farm)}）`).join('・')}</div>
    <div class="cap">使用量は一般的な目安です。その他の材料・送料・手数料は含みません。${skip.length ? `計算に含めていない食材：${skip.map(h).join('・')}。` : ''}販売価格や利益率は、お店の価格設定がないため計算していません。</div></div>`;
}
const gradeMark = l => l.grade === '規格外' ? `・規格外（${h(l.reason)}）` : l.surplus ? '・余剰' : '';
function menuSheet(){
  const sel = menuSel.map(byId).filter(Boolean), selItems = new Set(sel.map(l => l.item)), open = openListings();
  const avail = item => open.filter(l => l.item === item && !menuSel.includes(l.id)).sort((x,y) => x.price - y.price)[0];
  const others = [...new Set(open.map(l => l.item))].filter(i => !selItems.has(i));
  const off = sel.filter(l => l.grade === '規格外' || l.surplus);
  return sheetFrame('限定メニュー案', plainTop('🍳 限定メニュー案'), `
    <div><div class="sec-label">仕入れ案の食材（登録データ）</div>
      <div class="tags" style="margin-top:6px">${sel.length ? sel.map(l => `<button type="button" class="tag good" data-menudel="${h(l.id)}" title="外す">${art(l.item)} ${h(l.item)}・${h(l.farm)}${gradeMark(l)} ✕</button>`).join('') : '<span class="muted">まだ選ばれていません</span>'}</div>
      ${others.length ? `<div class="tags" style="margin-top:8px"><span class="cap">食材を足す：</span>${others.map(i => { const l = avail(i); return l ? `<button type="button" class="tag" data-menuadd="${h(l.id)}">＋ ${art(i)} ${h(i)}</button>` : ''; }).join('')}</div>` : ''}</div>
    ${off.length ? `<div class="msg ok">規格外・余剰の食材（${off.map(l => h(l.farm + 'の' + l.item)).join('・')}）を含みます。形を問わない煮込み・刻む料理・ソースに向いています。</div>` : ''}

    <div id="menu-out">${menuOut()}</div>`);
}
function menuOut(){
  const sel = menuSel.map(byId).filter(Boolean), selItems = new Set(sel.map(l => l.item)), open = openListings();
  const avail = item => open.filter(l => l.item === item && !menuSel.includes(l.id)).sort((x,y) => x.price - y.price)[0];

        <ul class="menu-need">${needs.map(i => { const s = sel.find(l => l.item === i), a = !s && avail(i);
          return s ? `<li class="ok">✓ ${art(i)} ${h(i)}：<b>選択済み</b>・${h(s.farm)}${gradeMark(s)}・¥${s.price.toLocaleString('ja-JP')}/${h(s.unit)}・残り${q(s.qty,s.unit)}・${h(fmtDate(s.date))}出荷（登録データ）${menuQtyNote(i, s)}</li>`
            : a ? `<li class="part">△ ${art(i)} ${h(i)}：<b>仕入れ可能（未選択）</b>・${h(a.farm)}・¥${a.price.toLocaleString('ja-JP')}/${h(a.unit)}・残り${q(a.qty,a.unit)}・${h(fmtDate(a.date))}出荷 <button type="button" class="link" data-menuadd="${h(a.id)}" style="min-height:auto;font-size:13px">＋選ぶ</button>${menuQtyNote(i, a)}</li>`

        ${(() => { const miss = needs.filter(i => !sel.some(l => l.item === i) && !avail(i)); return miss.length ? `<div class="msg warn">この料理に必要な登録食材のうち、${miss.map(h).join('・')}はいま出品がありません。すべての食材がそろうとは限りません。</div>` : ''; })()}
        ${menuCost(needs, sel, avail)}

      </article>`).join('')

}

/* ---------- restaurant: plan ---------- */
function slotLabel(key){ const [d,t,p] = key.split('|'); return {date:fmtDate(d), time:t.replace('-','〜'), place:p}; }
function reqChips(r){
  return [r.item, q(r.qty,r.unit), `${fmtDate(r.deadline)}${r.dateMode==='by'?'まで':''}`, r.region||'地域指定なし', r.allowOff?'規格外可':'規格外を含めない', r.maxPrice!=null?`${yen(r.maxPrice)}/${r.unit}まで`:null, r.place||null]
    .filter(Boolean).map(h).join('・');
}
// 候補ごとの「確認が必要な点」。登録データから言えることだけを書く
function planChecks(l, k){
  const out = [];
  if(!l.id) return out;
  if(l.grade === '規格外') out.push(`規格外（${l.reason}）を含みます。料理の用途に合うか確認してください`);
  if(l.surplus) out.push('余剰品として登録された供給です');
  if(k.amt < l.qty) out.push(`登録数量${q(l.qty,l.unit)}のうち${q(k.amt,l.unit)}を使う案です`);
  out.push('在庫は未確保・農家承認前です。数量・価格は取引相談で確認してください');
  return out;
}
// 複数の農家の数量が、希望の数量に向かって積み上がる帯（計算結果の picks だけを使う）
function gatherViz(p, goal, unit){
  const short = Math.max(0, +(goal - p.total).toFixed(1));
  const seg = (k, i) => `<span class="sg c${i % 5}" style="flex:${k.amt}" title="${h(k.farm)} ${q(k.amt,unit)}">${q(k.amt,unit)}</span>`;
  return `<div class="gather">
      <div class="gather-h"><span class="k">${p.picks.length}軒の農家の在庫を組み合わせて</span><span class="goal">希望 <b>${+goal}</b>${h(unit)}</span></div>
      <div class="cv-bar" role="img" aria-label="${h(p.picks.map(k => `${k.farm}${q(k.amt,unit)}`).join('、'))}${short ? `、不足${q(short,unit)}` : ''}">${p.picks.map(seg).join('')}${short ? `<span class="sg short" style="flex:${short}">不足 ${q(short,unit)}</span>` : ''}</div>
      <ul class="cv-legend">${p.picks.map((k,i) => `<li><i class="c${i % 5}"></i>${h(k.farm)} <b>${q(k.amt,unit)}</b></li>`).join('')}${short ? `<li><i class="short"></i>不足 <b>${q(short,unit)}</b></li>` : ''}</ul>
      <p class="cv-eq">${p.picks.map(k => `${h(k.farm)} ${q(k.amt,unit)}`).join(' ＋ ')} ＝ <b>${q(p.total,unit)}</b>${short ? `（希望まで${q(short,unit)}不足）` : ''}</p>
    </div>`;
}
function slipCards(p, unit){
  return p.picks.map((k, i) => { const l = byId(k.id) || {}, checks = planChecks(l, k);
    return `<div class="fc"><div class="face" aria-hidden="true">👨‍🌾<i class="dot c${i % 5}"></i></div><div class="who">${h(k.farm)}<span>📍${h(l.region||'')}${l.variety?'・'+h(l.variety):''}</span></div>
      <div class="meta"><span>¥${(l.price||0).toLocaleString('ja-JP')}/${h(unit)}</span>${l.grade==='規格外'?`<span class="tag">規格外・${h(l.reason)}</span>`:''}${l.surplus?'<span class="tag">余剰</span>':''}</div>
      <div class="amt"><div><b>${+k.amt.toFixed(1)}</b><small>${h(unit)}</small></div><div class="yen">${yen(k.cost)}</div></div>
      ${checks.length ? `<div class="checks" style="grid-column:1/-1;margin-top:6px"><div class="t">確認が必要な点</div><ul>${checks.map(c => `<li>${h(c)}</li>`).join('')}</ul></div>` : ''}</div>`; }).join('');
}
function summarize(res, r){
  if(res.status === 'ok') return `${res.best.picks.map(p=>`${p.farm}${q(p.amt,r.unit)}`).join('＋')}＝${q(r.qty,r.unit)}・${yen(res.best.cost)}`;
  return res.partial ? `${r.item} 最大${q(res.partial.total,r.unit)}（${q(r.qty-res.partial.total,r.unit)}不足）` : `${r.item} 条件の合う出品なし`;
}
// 在庫が変わったら古い案を使えない状態にして、残りの在庫を含めて計算し直す
function refreshPlan(){
  const P = S.plan, now = snapshot(P.req.item), ch = diffSnap(P.snap, now);
  if(!ch.length) return;
  const old = summarize(P.result, P.req), oldNo = P.no;
  S.planSeq++;
  S.plan = {req:P.req, result:allocate(P.req), snap:now, no:planNo(), prev:{summary:old, changes:ch, no:oldNo}};
  save();
}
function planNo(){ const d = today0(); return `${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(S.planSeq)}`; }
function resultView(){

  let banner = '';
  if(prev){
    const tail = res.status === 'ok' ? `現在も${q(r.qty,u)}で成立します。組み合わせを更新しました。` : res.partial ? `現在の合計は${q(res.partial.total,u)}で${q(short,u)}不足です。` : '現在、条件の合う出品はありません。';
    banner = `<div class="msg err"><b>在庫が変わったため、案 No.${h(prev.no)} は使えません。</b><br>${h(prev.changes.join('。'))}。${h(tail)}</div>
      <div class="slip void"><div class="foot void-body"><span class="slip-no">旧案 No.${h(prev.no)}</span><span>${h(prev.summary)}</span></div></div>`;

      </dl>

      <div>${slipCards(res.best,u)}</div>
      <div class="total"><span>合計</span><span>${q(r.qty,u)}　${yen(res.best.cost)}</span></div>
      <p class="cap">（参考）この仕入れが成立した場合の想定手数料：${yen(Math.round(res.best.cost * COMMISSION_RATE_REF))}（検討中の仮の手数料率${Math.round(COMMISSION_RATE_REF*100)}%・実際の請求は発生しません）</p>`;
  } else {
    verdict = {
      none: `条件に合う${r.item}の出品がありません`,
      short: `希望${q(r.qty,u)}に対し、条件の合う登録数量は${q(res.partial?.total||0,u)}。${q(short,u)}不足`,
      slot: '数量はありますが、同じ日時・場所で受け取れる組み合わせがありません',
      step: `最低販売量・販売刻みの都合で、ちょうど${q(r.qty,u)}にできません`
    }[res.status];
    if(res.partial){
      const s = slotLabel(res.partial.slot);
      body = `<dl class="sum">
          <div><dt>数量</dt><dd><span class="bigv">${+res.partial.total.toFixed(1)}<small>${h(u)}まで</small></span><span class="sub">希望${q(r.qty,u)}に${q(short,u)}足りません</span></dd></div>
          <div><dt>受け渡し</dt><dd><b>${h(s.date)}</b> ${h(s.time)}<span class="sub">${h(s.place)}</span></dd></div>
          <div><dt>費用</dt><dd><b>${yen(res.partial.cost)}</b><span class="sub">${q(res.partial.total,u)}分の参考額</span></dd></div>
        </dl>
        ${gatherViz(res.partial, r.qty, u)}
        <div class="slip-sec">参考：いま揃う最大量の内訳（成立していません）</div>
        <div>${slipCards(res.partial,u)}</div>`;
    }
  }
  const ex = res.excluded.length ? `<details><summary>この案で使わなかった出品（${res.excluded.length}件）</summary><ul class="ex">${res.excluded.map(e=>{const l=byId(e.id);return `<li><b>${h(l.farm)} ${h(l.item)} ${q(l.qty,l.unit)}</b><span>${h(e.reasons.join('・'))}</span></li>`;}).join('')}</ul></details>` : '';
  let sg = '';
  if(res.status !== 'ok'){
    const list = suggest(r);
    if(res.partial) list.push({label:`数量を${q(res.partial.total,u)}にする`, patch:{qty:res.partial.total}, detail:'いま揃う量で案を作ります'});
    sg = `<section class="card"><h2 class="sec-title">条件を変えると… 💡</h2><p class="muted" style="font-size:14px">数量を勝手に丸めたり、別の品種に置き換えたりはしません。変える条件を選んでください。</p>
      <div class="sugg">${list.map((s,i)=>`<div class="s"><div>${h(s.label)}<span>${h(s.detail)}</span></div><button type="button" class="btn small btn-sub" data-sugg="${i}">この条件で再計算</button></div>`).join('') || '<p class="muted">条件をゆるめても成立する組み合わせは見つかりませんでした。</p>'}</div></section>`;
    S._sugg = list;
  }
  const saved = S.saved.some(s => s.no === S.plan.no);
  const pick = res.best || res.partial;
  return `${banner}
  <div class="cond"><span>条件：<b>${reqChips(r)}</b></span><button type="button" class="link" id="edit-cond-top" style="white-space:nowrap">変える</button></div>
  <article class="slip">
    <div class="slip-head ${res.status==='ok'?'ok':'bad'}"><div><div class="slip-no">仕入れ案 No.${h(S.plan.no)}</div><div class="verdict">${h(verdict)}</div></div>
      <div class="stamp" aria-label="状態：農家承認前・在庫未確保"><b>未確保</b><small>農家承認前</small></div></div>
    ${body}
    <div class="foot"><span>この案は注文・在庫予約ではありません。同じ在庫が他店の案に入ることがあります。</span><span>農家さんへの連絡・承認、決済、配送は対象外です。</span></div>
  </article>
  ${sg}
  <button type="button" class="btn ${saved?'':'btn-main'}" id="save-plan" ${saved?'disabled':''}>${saved?'📖 記録に保存済み':'この案を保存して取引相談へ →'}</button>
  ${pick ? `<button type="button" class="ask-cta" id="plan-menu" style="background:var(--yellow-soft)"><span style="font-size:30px;width:44px;text-align:center" aria-hidden="true">🍳</span><span><b>この案の食材で限定メニュー案を考える</b><span>規格外・余剰の食材も生かせる料理例と、原価の目安を出します</span></span></button>` : ''}
  ${ex ? `<section class="card">${ex}</section>` : ''}
  <div class="row"><button type="button" class="btn grow" id="edit-cond">条件を変える</button><button type="button" class="btn grow" id="new-req">新しく作る</button></div>
  <button type="button" class="link" data-tab="farm" style="align-self:center">出品画面で在庫を変えて、再計算を確かめる</button>`;
}
function buildPlan(r){
  S.planSeq++;
  S.plan = {req:r, result:allocate(r), snap:snapshot(r.item), no:planNo(), prev:null};
  S.tab = 'shop'; S.step = 'result'; animate = true; save(); render(); window.scrollTo(0,0);
}
const OUT_MSG = {
  personal: 'このデモは地域の生産者と飲食店の仕入れ案づくりが対象です。家庭用・個人のご購入には対応していません。',
  nationwide: 'このデモは地域の生産者と飲食店の仕入れ案づくりが対象です。全国への配送・発送には対応していません。',
  multi: '1回の依頼で扱える品目は1つです。最初の品目で条件を整理しました。ほかの品目は、この案のあとに別の依頼として入力してください。'
};
async function doParse(){
  const text = $('#req-text').value.trim();
  S.draft.text = text;
  if(!text){ S.draft.note = '品目・数量・希望日を入力してください。上の例を選ぶか、「項目を選んで入力する」から続けられます。'; S.draft.noteKind='warn'; save(); render(); return; }
  if(text.length > 200){ S.draft.note = '200文字以内で入力してください。'; S.draft.noteKind='warn'; save(); render(); return; }
  busy = true; S.draft.note = ''; render();
  let parsed = null, note = '', kind = 'ok';
  let r = null;
  if(server.aiReady){ try { r = await api('/api/parse', {text}); } catch(e) {} }
  if(r && r.ok && r.data.parsed){ parsed = clean(r.data.parsed); note = '✨ AIが条件を整理しました。違うところは直してください。'; }
  if(!parsed){
    parsed = clean(ruleParse(text)); kind = 'warn';
    note = !server.aiReady ? '🔌 AIが未設定のため、簡易読み取りで項目を埋めました。項目を選んで続けられます。'
      : r && r.status === 429 ? 'AIの読み取りが短時間に集中したため、簡易読み取りで項目を埋めました。項目を選んで続けられます。'
      : 'AIに接続できなかったため、簡易読み取りで項目を埋めました。項目を選んで続けられます。';
  }
  busy = false;
  if(parsed.unreadable && !parsed.item && !parsed.qty){
    S.draft.note = '<b>条件を読み取れません。</b>品目・数量・希望日を含めて書き直すか、「項目を選んで入力する」から続けてください。'; S.draft.noteKind = 'err'; save(); render(); return;
  }
  if(parsed.outOfScope === 'personal' || parsed.outOfScope === 'nationwide'){
    S.draft.note = h(OUT_MSG[parsed.outOfScope]); S.draft.noteKind = 'warn'; save(); render(); return;
  }
  if(parsed.outOfScope === 'multi'){ note = OUT_MSG.multi + '<br>' + note; kind = 'warn'; }
  S.draft.req = parsed; S.draft.note = note; S.draft.noteKind = kind; S.step = 'confirm'; animate = true; save(); render();
}

/* ---------- records (saved plans) ---------- */
function savePlan(){
  const P = S.plan; if(!P) return;
  if(S.saved.some(s => s.no === P.no)){ toast('この案はもう保存しています'); return; }
  const res = P.result, pick = res.best || res.partial;
  S.saved.unshift({
    no:P.no, at:Date.now(), req:P.req, status:res.status, summary:summarize(res, P.req),
    slot:pick ? pick.slot : null, cost:pick ? pick.cost : 0,
    picks:(pick ? pick.picks : []).map(k => ({id:k.id, farm:k.farm, amt:k.amt, cost:k.cost}))
  });

// 保存した案を、いまの在庫で計算し直して比べる
function checkSaved(s){
  if(s.req.deadline < iso(today0())) return {kind:'past'};
  const now = allocate(s.req), p = now.best || now.partial;
  const sig = picks => JSON.stringify((picks||[]).map(k => [k.id, k.amt]));
  const same = now.status === s.status && sig(p && p.picks) === sig(s.picks);
  return {kind: same ? 'same' : 'changed', summary: summarize(now, s.req), ok: now.status === 'ok'};
}

function inputWarnings(d){

  if(qty > 0 && +d.minQty > 0 && qty < +d.minQty) w.push('販売可能量が最低販売量より少なくなっています');

}

function validateStep(n, d){
  const e = [], num = v => +v;
  if(n === 1){
    if(!String(d.farm).trim() || String(d.farm).trim().length > 30) e.push('農家名を30文字以内で入力してください');
    else if(isDemoFarm(String(d.farm).trim()) && !(S.fdraft && S.fdraft.editId && (byId(S.fdraft.editId) || {}).demo)) e.push(`「${String(d.farm).trim()}」はデモ用の架空の農家名です。あなたの農家名を入力してください`);

    if(!ITEMS.includes(d.item)) e.push('食材を選んでください');
    if(!FARM_REGIONS.includes(d.region)) e.push('産地を選んでください');
    if(d.grade === '規格外' && !OFF_REASONS.includes(d.reason)) e.push('規格外の理由を選んでください');
  } else if(n === 2){
    if(!(num(d.qty) > 0 && num(d.qty) <= 999)) e.push('販売可能量は0より大きく999以下で入力してください');
    if(!UNITS.includes(d.unit)) e.push('単位を選んでください');
    if(!(num(d.minQty) > 0)) e.push('最低販売量は0より大きい数にしてください');
    if(!(num(d.step) >= 0.1)) e.push('販売刻みは0.1以上にしてください');
    if(num(d.minQty) > num(d.qty)) e.push('最低販売量が販売可能量より大きくなっています');
  } else if(n === 3){
    if(!(Number.isInteger(num(d.price)) && num(d.price) >= 1 && num(d.price) <= 100000)) e.push('単価は1〜100,000円の整数で入力してください');

  }
  return e;
}

function confetti(){
  if(reduceMotion()) return;
  const colors = ['#8cc79a','#f3d77b','#f5b48a','#a98bc4','#f19a7f','#e9dcc2'];
  for(let i = 0; i < 36; i++){
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = (20 + Math.random()*60) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random()*160 - 80) + 'px');
    c.style.setProperty('--r', (Math.random()*720 - 360) + 'deg');
    c.style.animationDelay = (Math.random()*0.25) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

// 2回押しで実行する確認つきボタン
function armed(t, msg){
  if(t.dataset.armed === '1') return true;
  t.dataset.armed = '1'; t.dataset.label = t.textContent; t.textContent = msg;
  setTimeout(() => { if(t.isConnected && t.dataset.armed === '1'){ t.dataset.armed = ''; t.textContent = t.dataset.label; } }, 5000);
  return false;
}
function readWizard(){ document.querySelectorAll('#app [data-f]').forEach(el => { S.fdraft.d[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; }); }
const listingOf = l => Object.fromEntries(LISTING_KEYS.map(k => [k, l[k] ?? '']));
document.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if(!t){
    // ボタン以外：シートの背景
    if(ev.target.classList && ev.target.classList.contains('sheet-bg')) return closeSheet();
    return;
  }
  const id = t.id, ds = t.dataset;
  if(ds.closeSheet != null) return closeSheet();

  // limited menu
  if(id === 'plan-menu'){ const p = S.plan && (S.plan.result.best || S.plan.result.partial); return openMenu(p ? p.picks.map(k => k.id) : []); }
  if(ds.menuadd){ menuSel = [...new Set([...menuSel, ds.menuadd])]; return renderSheet(); }
  if(ds.menudel){ menuSel = menuSel.filter(x => x !== ds.menudel); return renderSheet(); }
  if(id === 'menu-ai'){
    const sel = menuSel.map(byId).filter(Boolean); if(!sel.length) return;
    t.disabled = true; t.textContent = 'AIが考えています…';
    api('/api/draft', {kind:'menu', listingIds:sel.map(l => l.id), wants:{note:menuPurpose, qty:menuServ}}).then(r => {
      menuAI = r && r.ok && r.data.text ? r.data.text : null;
      if(!menuAI) toast('AIのメニュー案を作れませんでした。下の料理例を使ってください', null, 'err');
      if(sheetMode === 'menu') renderSheet();
    }).catch(() => { toast('通信できませんでした', null, 'err'); if(sheetMode === 'menu') renderSheet(); });
    return;
  }

  if(id === 'retry'){ server.error = ''; render(); return fetchListings(); }
  if(ds.ldel){
    const l = byId(ds.ldel); if(!l) return;
    if(!armed(t, 'もう一度押すと削除（元に戻せません）')) return;
    t.disabled = true;
    mutate({op:'delete', id:l.id}).then(res => {
      if(!res){ t.disabled = false; return; }
      render();
      toast(`${l.farm}の${l.item}を削除しました。仕入れ案の計算からも外れます`, null, 'ok');
    });
    return;
  }
  if(ds.savedate){
    const l = byId(ds.savedate); if(!l) return;
    const nd = ($('#qd-' + l.id) || {}).value || '';
    if(!isISO(nd) || nd < iso(today0())){ toast('出荷日は今日以降の日付を選んでください', null, 'err'); return; }
    if(nd === l.date){ toast('出荷日は変わっていません'); return; }
    t.disabled = true;
    mutate({op:'edit', id:l.id, listing:{...listingOf(l), date:nd}}).then(res => { t.disabled = false; if(!res) return; flashId = l.id; render(); toast(`${l.farm}の${l.item}の出荷日を${fmtDate(nd)}に変更しました。仕入れ案の計算に反映済みです`, null, 'ok'); });
    return;
  }
  if(ds.edit){
    const l = byId(ds.edit); if(!l) return;
    S.fdraft = {step:1, editId:l.id, d:{...FD(), ...listingOf(l)}};
    if(!S.fdraft.d.reason) S.fdraft.d.reason = OFF_REASONS[0];
    closeSheet(); S.tab = 'farm';
    wizErr = []; justAdded = null; animate = true; save(); render(); window.scrollTo(0,0); return;
  }
  if(ds.tab) return go(ds.tab);
  if(id === 'back'){ const f = backTarget(); if(f){ if(S.fdraft && S.tab === 'farm') readWizard(); f(); animate = true; save(); render(); window.scrollTo(0,0); } return; }

  // home / shortcuts
  if(ds.go === 'find'){ S.step = 'input'; shopView = 'request'; return go('shop'); }
  if(ds.shopview){ shopView = ds.shopview; render(); return; }
  if(ds.mkItem){ marcheItem = ds.mkItem; marcheRegion = ''; marcheIdx = 0; shopView = 'match'; S.step = 'input'; return go('shop'); }
  if(ds.go === 'sell'){ if(!S.fdraft){ S.fdraft = {step:1, d:{...FD(), ...(farmLocked() ? {farm:me.name} : {})}}; wizErr = []; } return go('farm'); }
  if(ds.resume) return go(ds.resume);
  if(ds.restart === 'shop'){ S.step = 'input'; S.draft = {text:'', req:null, note:''}; save(); return go('shop'); }
  if(ds.restart === 'farm'){ S.fdraft = {step:1, d:FD()}; wizErr = []; save(); return go('farm'); }
  if(ds.openPlan != null){ S.step = 'result'; return go('shop'); }

  // restaurant
  if(ds.ex != null){ S.draft.text = ds.ex; S.draft.note = ''; save(); render(); return; }
  if(id === 'parse') return doParse();
  if(id === 'manual'){ S.draft.text = ($('#req-text')?.value || '').trim(); S.draft.req = clean({}); S.draft.note = '項目を選んで続けられます。'; S.draft.noteKind = 'ok'; S.step = 'confirm'; animate = true; save(); render(); return; }
  if(id === 'mk-geo'){
    if(!navigator.geolocation){ geoStatus = 'unsupported'; const w = $('#mk-geo-wrap'); if(w) w.innerHTML = geoButtonHtml(); return; }
    geoStatus = 'loading'; t.disabled = true; t.textContent = '現在地を取得しています…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        geoStatus = 'ok';
        marcheIdx = 0;
        const o = $('#mk-out'); if(o){ o.innerHTML = deckHtml(); bindDeck(); }
        const w = $('#mk-geo-wrap'); if(w) w.innerHTML = geoButtonHtml();
      },
      () => {
        geoStatus = 'denied';
        const w = $('#mk-geo-wrap'); if(w) w.innerHTML = geoButtonHtml();
      },
      { timeout: 8000 }
    );
    return;
  }
  if(id === 'mk-like'){ likeCurrent(true); return; }
  if(id === 'mk-skip'){ skipCurrent(true); return; }
  if(id === 'mk-restart'){ marcheIdx = 0; const o = $('#mk-out'); if(o){ o.innerHTML = deckHtml(); bindDeck(); } return; }
  if(id === 'sheet-skip'){ closeSheet(); skipCurrent(false); return; }
  if(id === 'sheet-like'){ closeSheet(); likeCurrent(false); return; }
  if(ds.browseBuild){
    const l = byId(ds.browseBuild); if(!l) return;
    const region = Object.keys(REGION_GROUPS).find(k => (REGION_GROUPS[k] || []).includes(l.region)) || '';
    S.draft.text = `${l.farm}の${l.item}を${q(l.qty,l.unit)}`;
    S.draft.req = clean({item:l.item, qty:l.qty, unit:l.unit, deadline:l.date, dateMode:'by', region, place:l.place, allowOff:l.grade==='規格外', allowOffStated:l.grade==='規格外'});
    S.draft.note = `${h(l.farm)}の${h(l.item)}をもとに条件を入れました。必要なところを直してください。`; S.draft.noteKind = 'ok';
    S.step = 'confirm'; go('shop'); return;
  }
  if(id === 'back-input'){ S.step = 'input'; S.draft.note = ''; animate = true; save(); render(); return; }
  if(id === 'build'){ const {r, err} = readConfirm(); if(err.length){ $('#c-err').innerHTML = `<ul class="err-list">${err.map(e=>`<li>${h(e)}</li>`).join('')}</ul>`; return; } S.draft.req = {...S.draft.req, ...r}; return buildPlan(r); }
  if(ds.sugg != null){ const s = S._sugg[+ds.sugg]; const r = {...S.plan.req, ...s.patch}; S.draft.req = {...r, allowOffStated:true}; return buildPlan(r); }
  if(id === 'edit-cond' || id === 'edit-cond-top'){ S.draft.req = {...S.plan.req, allowOffStated:true}; S.draft.note = ''; S.step = 'confirm'; animate = true; save(); render(); return; }
  if(id === 'new-req'){ S.step = 'input'; S.draft = {text:'', req:null, note:''}; animate = true; save(); render(); return; }
  if(id === 'save-plan') return savePlan();

  // records
  if(ds.reopen != null){ const s = S.saved[+ds.reopen]; if(!s) return; S.draft.req = {...s.req, allowOffStated:true}; S.draft.note = ''; return buildPlan(s.req); }
  if(ds.del != null){ if(!armed(t, 'もう一度押すと削除')) return; S.saved.splice(+ds.del, 1); save(); render(); toast('保存した案を削除しました'); return; }
  if(ds.unlike){ S.liked = S.liked.filter(id => id !== ds.unlike); save(); render(); toast('いいねを外しました'); return; }

  // producer wizard
  if(id === 'open-form'){ S.fdraft = {step:1, d:{...FD(), ...(farmLocked() ? {farm:me.name} : {})}}; wizErr = []; justAdded = null; animate = true; save(); render(); window.scrollTo(0,0); $('#f-farm')?.focus(); return; }
  if((ds.fdec != null || ds.finc != null) && S.fdraft){
    const inp = $('#f-qty'), step = +S.fdraft.d.step > 0 ? +S.fdraft.d.step : 0.1;
    inp.value = Math.max(0, +((+inp.value || 0) + (ds.finc != null ? step : -step)).toFixed(1));
    inp.dispatchEvent(new Event('input', {bubbles:true}));
    return;
  }
  if(id === 'w-cancel'){ S.fdraft = null; wizErr = []; animate = true; save(); render(); return; }
  if(id === 'w-prev'){ readWizard(); S.fdraft.step--; wizErr = []; animate = true; save(); render(); window.scrollTo(0,0); return; }
  if(ds.wstep){ S.fdraft.step = +ds.wstep; wizErr = []; animate = true; save(); render(); window.scrollTo(0,0); return; }
  if(id === 'w-next'){
    readWizard();
    wizErr = validateStep(S.fdraft.step, S.fdraft.d);
    if(!wizErr.length){ S.fdraft.step++; animate = true; }
    save(); render(); window.scrollTo(0,0); return;
  }
  if(id === 'w-submit'){
    const d = S.fdraft.d;
    wizErr = [1,2,3,4].flatMap(n => validateStep(n, d));
    if(wizErr.length){ render(); return; }
    const listing = {...listingOf(d), farm:String(d.farm).trim(), variety:String(d.variety).trim(), qty:+d.qty, price:+d.price, minQty:+d.minQty, step:+d.step, surplus:d.surplus === true};
    const editId = S.fdraft.editId;
    t.disabled = true; t.textContent = editId ? '保存しています…' : '出品しています…';
    mutate(editId ? {op:'edit', id:editId, listing} : {op:'add', listing}).then(res => {
      if(!res){ if(t.isConnected){ t.disabled = false; t.textContent = editId ? 'この内容で保存する' : 'この内容で出品する 🌱'; } return; }
      S.fdraft = null; flashId = res.id; justAdded = editId ? null : res.id; animate = true; save(); render(); window.scrollTo(0,0);
      if(editId){ toast(`${listing.farm}の${listing.item}を更新しました。仕入れ案の計算に反映済みです`, null, 'ok'); return; }

      toast(`${listing.farm}の${listing.item} ${q(listing.qty,listing.unit)}を出品しました`, S.plan ? {label:'仕入れ案を見る', run:()=>{ S.step = 'result'; go('shop'); }} : null, 'ok');
    });
    return;
  }

  // producer listings
  if(ds.dec || ds.inc){ const l = byId(ds.dec || ds.inc), inp = $('#q-'+l.id); inp.value = Math.max(0, +((+inp.value || 0) + (ds.inc ? l.step : -l.step)).toFixed(1)); return; }

  if(ds.save){
    const l = byId(ds.save), nv = +$('#q-'+l.id).value;

    if(nv === l.qty){ toast('数量は変わっていません'); return; }
    const old = l.qty, who = l.farm, item = l.item, unit = l.unit, lid = l.id;
    t.disabled = true;
    mutate({op:'qty', id:lid, qty:nv}).then(res => {
      t.disabled = false;
      if(!res) return;
      flashId = lid; render();
      toast(`${who}の${item}を${q(old,unit)}→${q(nv,unit)}に変更しました`, toPlan(item));
    });
    return;
  }
  if(ds.toggle){
    const l = byId(ds.toggle), who = l.farm, item = l.item, lid = l.id;
    t.disabled = true;
    mutate({op:'toggle', id:lid}).then(res => {
      t.disabled = false;
      if(!res) return;
      const now = byId(lid); flashId = lid; render();
      toast(now && now.active ? `${who}の${item}の公開を再開しました` : `${who}の${item}の公開を止めました（仕入れ案に使われなくなります）`, toPlan(item));
    });
    return;
  }
  if(ds.boost){
    const l = byId(ds.boost); if(!l) return;
    if(l.boostRequested){
      if(!armed(t, 'もう一度押すと取り下げます')) return;
      t.disabled = true;
      mutate({op:'boost-request', id:l.id, requested:false}).then(res => {
        t.disabled = false;
        if(!res) return;
        flashId = l.id; render();
        toast('ブーストの申し込みを取り下げました');
      });
    } else openBoostSheet(l.id);
    return;
  }
  if(ds.boostConfirm){
    const l = byId(ds.boostConfirm); if(!l) return;
    t.disabled = true;
    mutate({op:'boost-request', id:l.id, requested:true}).then(res => {
      t.disabled = false;
      if(!res) return;
      closeSheet(); flashId = l.id; render();
      toast('申し込みを受け付けました。まだお支払いは発生していません', null, 'ok');
    });
    return;
  }

  // login / account
  if(ds.lmode){ keepAuth(); loginMode = ds.lmode; render(); $('#a-id')?.focus(); return; }
  if(ds.lrole){ keepAuth(); signupRole = ds.lrole; render(); return; }
  if(id === 'logout'){
    t.disabled = true;
    api('/api/auth', {op:'logout'}).catch(() => {}).finally(() => { setToken(''); me = null; render(); toast('ログアウトしました'); fetchListings({quiet:true}); });
    return;
  }
  if(id === 's-save-name' || id === 's-save-pw'){
    const nameMode = id === 's-save-name';
    const body = nameMode ? {op:'update', name:$('#s-name').value, currentPassword:$('#s-name-pw').value}
      : {op:'update', newPassword:$('#s-pw-new').value, currentPassword:$('#s-pw-cur').value};
    if(!body.currentPassword){ toast('今のパスワードを入力してください'); return; }
    t.disabled = true;
    api('/api/auth', body).then(r => {
      t.disabled = false;
      if(!r.ok){ toast(r.data.error || '変更できませんでした', null, 'err'); return; }
      if(r.data.token) setToken(r.data.token);
      me = r.data.user; render();
      toast(nameMode ? `${nameLabel(me.role)}を「${me.name}」に変更しました` : 'パスワードを変更しました。ほかの端末ではログアウトされます', null, 'ok');
    }).catch(() => { t.disabled = false; toast('通信できませんでした。もう一度試してください'); });
    return;
  }

  // settings
  if(id === 'reset'){
    if(!armed(t, 'デモの出品だけを初期状態に戻します。もう一度押すと実行')) return;
    mutate({op:'reset'}).then(d => { if(!d) return; render(); toast(`デモデータを初期状態に戻しました（登録された出品${d.kept ? d.kept.listings : 0}件は残しています）`, null, 'ok'); });
    return;
  }
  if(id === 'wipe'){
    if(!armed(t, '下書き・仕入れ案・記録が消えます。もう一度押すと実行')) return;
    const listings = S.listings;
    S = freshState(); S.listings = listings; S.visited = true; S.tab = 'settings';
    save(); render(); toast('この端末の下書き・記録を消しました');
  }
});
function onField(ev){
  const el = ev.target;
  if(el.dataset.mn){ if(el.dataset.mn === 'serv') menuServ = el.value; else menuPurpose = el.value; const o = $('#menu-out'); if(o) o.innerHTML = menuOut(); return; }
  if(el.id === 'req-text'){ S.draft.text = el.value; save(); return; }
  if(el.dataset.f && S.fdraft){
    S.fdraft.d[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    save();
    const left = REQUIRED.filter(k => !filled(S.fdraft.d,k)).length, p = $('#w-left');
    if(p){ p.innerHTML = progressText(left); p.classList.toggle('done', !left); }
    const tot = $('#w-total'); if(tot) tot.innerHTML = totalText(S.fdraft.d);
    const wn = $('#w-warn'); if(wn) wn.innerHTML = warnHtml(S.fdraft.d);
    // 選択肢で見た目が変わる項目だけ描き直す（入力欄のchangeで描き直すと、直後の「次へ」のタップが消える）
    if(ev.type === 'change' && el.tagName === 'SELECT' && (el.dataset.f === 'grade' || el.dataset.f === 'item')) render();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', ev => {
  onField(ev);
  const el = ev.target;
  if(el.id === 'passcode'){ setPass(el.value.trim()); toast('🔑 パスコードをこの端末に保存しました'); return; }
  if(el.id === 'mk-item' || el.id === 'mk-region'){
    if(el.id === 'mk-item') marcheItem = el.value; else marcheRegion = el.value;
    el.classList.toggle('on', Boolean(el.value));
    marcheIdx = 0;
    const o = $('#mk-out'); if(o){ o.innerHTML = deckHtml(); bindDeck(); }
    return;
  }
  // 次回から：同じ農家名の前回の出品条件を読み込み、変更できるようにする
  if(el.id === 'f-farm' && S.fdraft){
    const prev = [...S.listings].reverse().find(l => l.farm === el.value.trim());
    if(!prev) return;
    for(const k of ['region','unit','place','from','to','minQty','step','item','variety','price']) S.fdraft.d[k] = prev[k];
    S.fdraft.d.farm = prev.farm;
    save(); render();
    toast(`${prev.farm}の前回の条件を読み込みました。必要なところを変えてください`);
  }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && sheetId){ closeSheet(); return; }
  if(ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.target.id === 'req-text'){
    ev.preventDefault(); doParse();
  }
});

document.addEventListener('submit', ev => {
  if(ev.target.id !== 'auth-form') return;
  ev.preventDefault();
  const su = loginMode === 'signup', btn = $('#a-submit');
  const body = su ? {op:'signup', role:signupRole, name:$('#a-name').value, loginId:$('#a-id').value, password:$('#a-pw').value, passcode:$('#a-pc')?.value || ''}
    : {op:'login', loginId:$('#a-id').value, password:$('#a-pw').value};
  const err = [];
  if(su && !body.name.trim()) err.push(`${nameLabel(signupRole)}を入力してください`);
  if(!body.loginId.trim()) err.push('ユーザー名を入力してください');
  if(!body.password) err.push('パスワードを入力してください');
  const showErr = list => { $('#a-err').innerHTML = `<ul class="err-list">${list.map(e => `<li>${h(e)}</li>`).join('')}</ul>`; };
  if(err.length) return showErr(err);
  btn.disabled = true;
  api('/api/auth', body).then(r => {
    btn.disabled = false;
    if(!r.ok) return showErr([r.data.error || 'ログインできませんでした']);
    setToken(r.data.token); me = r.data.user; authDraft = {}; loginMode = 'login';
    toast(su ? `登録しました。「${me.name}」でログインしています` : `「${me.name}」でログインしました`, null, 'ok');
    go(me.role === 'farm' ? 'farm' : 'home');
  }).catch(() => { btn.disabled = false; showErr(['通信できませんでした。もう一度試してください']); });
});

load();
firstVisit = !S.visited;
S.visited = true;
// ログイン画面を一番最初に表示する。トークンが無ければ確実に未ログインなので、
// サーバーへの確認を待たずにログイン画面から始める（仕入れ案の続きなどは、ホームの「続きから」で引き続き再開できる）。
if(!getToken()) S.tab = 'login';
save(); render();
fetchListings();
fetchMe().then(() => {
  if(me && S.tab === 'login'){ S.tab = 'home'; save(); }
  if(['login','settings','farm','home'].includes(S.tab)) render();
});
// 別の端末で在庫が変わったら、仕入れ案・ホーム・記録の画面に反映する
setInterval(() => { if(!document.hidden && server.loaded && !editing()) fetchListings({quiet:true}); }, 15000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && server.loaded) fetchListings({quiet:true}); });
})();
</script>
</body>
</html>
